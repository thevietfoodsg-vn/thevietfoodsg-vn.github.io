/* ---- nạp cả bảng mặt hàng một lần ---- */
function importForm(){
  openDialog("Nhập danh sách hàng", `
    <div class="note" style="margin-bottom:12px">Dán từ Excel / Google Sheets hoặc gõ tay. Mỗi món một dòng, các cột ngăn bằng <b>Tab</b>, <b>dấu phẩy</b> hoặc <b>|</b>, theo thứ tự:<br><br>
    <b>Tên · Nhóm · Đơn vị · Ký · Giá vốn · Giá bán · Tồn · Tối thiểu · Thương hiệu</b><br><br>
    Thiếu cột phía sau cũng được. Nhóm hợp lệ: ${GROUPS.filter(g=>g!=="Combo").join(", ")}. Thương hiệu: ${BRANDS.join(", ")}. Trùng tên thì cập nhật đè, không tạo trùng.</div>
    <div class="field"><textarea id="im_txt" style="min-height:190px;font-family:IBM Plex Mono,monospace;font-size:12px" placeholder="Xoài cát Hoà Lộc | Trái cây | kg | 1 | 6.5 | 12 | 14 | 10 | Viet SG Food
Bánh mì chả lụa | Món bếp | ổ | 0.3 | 1.5 | 4 | 0 | 0 | Bánh Mì Chả Lụa"></textarea></div>
    <div id="im_prev"></div>
  `, [
    {label:"Huỷ", cls:"ghost", fn:null},
    {label:"Xem trước", cls:"", fn:()=>{
      const rows = parseImport(document.getElementById("im_txt").value);
      const box = document.getElementById("im_prev");
      if(!rows.length){ box.innerHTML = '<div class="note" style="border-color:var(--danger)">Không đọc được dòng nào. Kiểm tra lại cách ngăn cột.</div>'; return false; }
      const nw = rows.filter(r=> !DB.items.some(i=> norm(i.name)===norm(r.name))).length;
      box.innerHTML = '<div class="card" style="margin-top:12px"><table class="tbl">'
        + rows.slice(0,40).map(r=>'<tr><td>'+esc(r.name)+'<span class="s">'+esc(r.group)+' · '+esc(r.unit)+' · '+r.kg+' kg</span></td><td class="mono">'+money(r.price)+'</td></tr>').join("")
        + (rows.length>40 ? '<tr><td colspan="2">… và '+(rows.length-40)+' dòng nữa</td></tr>' : "")
        + '</table></div>'
        + '<div class="note" style="margin-top:10px">Đọc được <b>'+rows.length+'</b> dòng — '+nw+' món mới, '+(rows.length-nw)+' món cập nhật đè.</div>'
        + '<button type="button" class="btn" id="im_go" style="margin-top:10px">Nạp '+rows.length+' món vào kho</button>';
      document.getElementById("im_go").onclick = ()=>{
        rows.forEach(r=>{
          const old = DB.items.find(i=> norm(i.name)===norm(r.name));
          const rec = Object.assign({sku: old ? old.sku : uid().slice(-5).toUpperCase()}, old||{}, r);
          mergeUp(DB.items, rec, "sku"); pushOutbox("item", rec);
        });
        save(); closeDialog(); renderAll(); toast("Đã nạp "+rows.length+" mặt hàng");
      };
      return false;
    }}
  ]);
}
function parseImport(txt){
  const out = [];
  String(txt||"").split(/\n+/).forEach(line=>{
    const raw = line.trim(); if(!raw) return;
    const c = raw.split(/\t|\s*\|\s*|\s*;\s*|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.trim().replace(/^"|"$/g,""));
    if(!c[0]) return;
    if(/^(tên|ten|name|mặt hàng)$/i.test(c[0])) return;   /* bỏ dòng tiêu đề */
    const num = v => { const n = parseFloat(String(v||"").replace(/[^0-9.,-]/g,"").replace(",",".")); return isNaN(n)?0:n; };
    const g = c[1] && GROUPS.indexOf(c[1]) > -1 ? c[1] : (GROUPS.find(x=> norm(x)===norm(c[1])) || "Đồ khô");
    const br = c[8] ? (BRANDS.find(x=> norm(x)===norm(c[8])) || "") : "";
    out.push({name:c[0], group:g, unit:(c[2]||"cái"), kg:num(c[3]), cost:num(c[4]), price:num(c[5]),
      qty:num(c[6]), min:num(c[7]), brand:br});
  });
  return out;
}

function showText(title, text){
  openDialog(title, '<div class="field"><textarea id="tx" style="min-height:300px;font-family:IBM Plex Mono,monospace;font-size:11px">'+esc(text)+'</textarea></div><div class="note">Bấm vào ô, chọn hết rồi copy — dán vào Excel hoặc Google Sheets.</div>',
    [{label:"Đóng", cls:"ghost", fn:null},
     {label:"Chép hết", cls:"", fn:()=>{ navigator.clipboard && navigator.clipboard.writeText(text); toast("Đã chép"); return false; }}]);
}

/* ============== 11. DIALOG ============== */
let dlgActions = [];
function openDialog(title, body, actions){
  $("#dlgTitle").textContent = title;
  $("#dlgBody").innerHTML = body;
  dlgActions = actions || [];
  $("#dlgFoot").innerHTML = dlgActions.map((a,i)=>'<button type="button" class="btn '+a.cls+'" data-a="'+i+'">'+a.label+'</button>').join("");
  $("#dlgFoot").querySelectorAll("[data-a]").forEach(b=> b.onclick = ()=>{
    const a = dlgActions[+b.dataset.a];
    if(!a.fn){ closeDialog(); return; }
    const r = a.fn();
    if(r !== false) closeDialog();
  });
  const d = $("#dlg");
  if(!d.open) d.showModal();
  $("#dlgBody").scrollTop = 0;
  fitDialog();
}
/* iPhone: đơn vị vh tính cả phần bị thanh Safari che, nên thanh nút dưới cùng
   bị đẩy xuống ngoài màn hình — thấy nút mà bấm không tới. Đo chiều cao THẬT
   rồi ép vào hộp thoại.                                                      */
function fitDialog(){
  const d = document.getElementById("dlg"); if(!d || !d.open) return;
  const vv = window.visualViewport;
  const h = Math.round(((vv && vv.height) || window.innerHeight || 0) * 0.92);
  if(h > 200){
    d.style.maxHeight = h + "px";
    const f = document.getElementById("dlgform");
    if(f) f.style.maxHeight = h + "px";
  }
}
window.addEventListener("resize", fitDialog);
window.addEventListener("orientationchange", ()=> setTimeout(fitDialog, 250));
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", fitDialog);
  window.visualViewport.addEventListener("scroll", fitDialog);
}
function closeDialog(){ const d=$("#dlg"); if(d.open) d.close(); }
$("#dlgform").addEventListener("submit", e=>{ e.preventDefault(); closeDialog(); });

/* ============== 12. ĐĂNG NHẬP ============== */
let pin = "";
function drawPin(){
  const b = document.querySelectorAll("#pinbox b");
  b.forEach((el,i)=>{ el.textContent = pin[i] ? "•" : ""; el.classList.toggle("f", i===pin.length); });
}
const ROLENAME = {owner:"Chủ", staff:"Nhân viên", kho:"Kho"};
function tryPin(){
  if(pin === DB.pins.owner){ enter("owner"); }
  else if(pin === DB.pins.stock){ enter("kho"); }
  else if(pin === DB.pins.staff){ enter("staff"); }
  else { $("#pinerr").textContent = "Sai PIN, thử lại"; pin=""; drawPin(); setTimeout(()=>$("#pinerr").textContent="",2000); }
}
function enter(role){
  ROLE = role; WHO = ROLENAME[role];
  try{ sessionStorage.setItem("3sis_role", role); }catch(e){}
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#roleChip").textContent = ROLENAME[role];
  $("#roleChip").classList.toggle("staff", role!=="owner");
  const d = new Date();
  $("#todayLabel").textContent = ["Chủ nhật","Thứ hai","Thứ ba","Thứ tư","Thứ năm","Thứ sáu","Thứ bảy"][d.getDay()] + ", " + d.getDate() + "/" + (d.getMonth()+1);
  const home = role==="kho" ? "prep" : "orders";
  TAB = myTabs().some(t=>t.k===home) ? home : myTabs()[0].k;
  go(TAB);
}
document.querySelectorAll(".keys button").forEach(b=>{
  b.onclick = ()=>{
    const k = b.dataset.k;
    if(k==="c") pin="";
    else if(k==="d") pin = pin.slice(0,-1);
    else if(pin.length<4) pin += b.textContent;
    drawPin();
    if(pin.length===4) setTimeout(tryPin, 130);
  };
});
document.addEventListener("keydown", e=>{
  if(!$("#login").classList.contains("hidden")){
    if(/^\d$/.test(e.key) && pin.length<4){ pin+=e.key; drawPin(); if(pin.length===4) setTimeout(tryPin,130); }
    if(e.key==="Backspace"){ pin=pin.slice(0,-1); drawPin(); }
  }
});
$("#logout").onclick = ()=>{
  ROLE=null; pin=""; drawPin();
  try{ sessionStorage.removeItem("3sis_role"); }catch(e){}
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
};

/* ============== 13. CHẠY ============== */
boot().then(()=>{
  drawPin();
  let r = null; try{ r = sessionStorage.getItem("3sis_role"); }catch(e){}
  if(r && ROLENAME[r]) enter(r);
});

})();
</script>
