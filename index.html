        time: $("#f_time").value,
        note: $("#f_note").value.trim(),
        pay: $("#f_pay").value,
        payMethod: $("#f_method").value,
        vnd: $("#f_vnd").value === "1",
        depositVnd: ($("#f_pay").value === "coc" && $("#f_vnd").value === "1") ? (parseFloat($("#f_deposit").value)||0) : 0,
        deposit: $("#f_pay").value !== "coc" ? 0
                 : ($("#f_vnd").value === "1" ? sgdFromVnd(parseFloat($("#f_deposit").value)||0)
                                              : (parseFloat($("#f_deposit").value)||0)),
        promoId: "",
        promoName: dPctAmt ? ("Giảm " + dPct + "% tiền hàng") : "",
        discPct: dPct,
        discount: dPctAmt,
        manualDiscount: dManual,
        discountNote: $("#f_mnote").value.trim(),
        items
      });
      if(!rec.customer && !items.length){ toast("Nhập tên khách hoặc chọn món"); return false; }
      if(!rec.noAddrCheck){
        const ck = checkAddress(rec.address);
        if(!ck.ok){
          drawAddrCheck();
          const ta = $("#f_address"); if(ta){ ta.scrollIntoView({block:"center"}); ta.focus(); }
          toast("Địa chỉ còn thiếu: " + ck.miss.join(", "));
          return false;
        }
      }
      ensureCode(rec);
      /* chỉ nhớ mã nhân viên, không nhớ mã page vì mã page đổi theo từng đơn */
      if(rec.agent){ try{ localStorage.setItem("3sis_agent", rec.agent); }catch(e){} }
      if(!o){ rec.createdBy = WHO; rec.createdAt = nowStamp(); }
      mergeUp(DB.orders, rec, "id"); pushOutbox("order", rec); save();
      go("orders");
    }}
  ]);

  /* ---- chọn món: tìm, chạm để +1, gõ nhanh ---- */
  /* ---- món tự gõ: không có trong kho, nhân viên nhập tên và giá ---- */
  function renderExtra(){
    const box = document.getElementById("extrabox"); if(!box) return;
    box.innerHTML = (extra.length
      ? '<div style="display:flex;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px">'
          + '<span style="flex:1">Tên món</span><span style="width:56px;text-align:center">SL</span>'
          + '<span style="width:72px;text-align:center">Đơn giá</span><span style="width:74px"></span></div>'
        + extra.map((e,ix)=>
          '<div class="xline" data-ix="'+ix+'">'
          + '<input class="xn" data-f="name" value="'+esc(e.name)+'" placeholder="Tên món">'
          + '<input class="xq mono" data-f="qty" type="number" min="0" step="0.5" value="'+e.qty+'">'
          + '<input class="xp mono" data-f="price" type="number" min="0" step="0.01" value="'+e.price+'" placeholder="0.00">'
          + '<button type="button" class="mi" data-keep="'+ix+'" title="Lưu vào kho">＋</button>'
          + '<button type="button" class="mi" data-del="'+ix+'">✕</button>'
          + '</div>'
          + '<input class="xnote" data-f="note" data-ix="'+ix+'" value="'+esc(e.note||"")+'" placeholder="Yêu cầu riêng của khách (chặt sẵn, ít cay…)">').join("")
        + '<div class="note" style="margin:8px 0 4px;font-size:11.5px">Bấm ＋ để lưu món vào kho — lần sau app tự nhận ra tên này.</div>'
      : '<div class="note" style="margin-bottom:8px">Dán tin nhắn ở trên là món tự vào đây, hoặc bấm nút dưới để gõ tay.</div>')
      + '<button type="button" class="btn soft sm" id="addExtra" style="margin:6px 0 10px">+ Thêm món</button>';

    box.querySelectorAll(".xline input").forEach(inp=>{
      inp.oninput = ()=>{
        const e = extra[+inp.closest(".xline").dataset.ix]; if(!e) return;
        const f = inp.dataset.f;
        e[f] = f === "name" ? inp.value : (parseFloat(inp.value) || 0);
        recalc();
      };
    });
    box.querySelectorAll(".xnote").forEach(inp=>{
      inp.oninput = ()=>{ const e = extra[+inp.dataset.ix]; if(e) e.note = inp.value; };
    });
    box.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=>{
      extra.splice(+b.dataset.del, 1); renderExtra(); recalc();
    });
    box.querySelectorAll("[data-keep]").forEach(b=> b.onclick = ()=>{
      const e = extra[+b.dataset.keep]; if(!e || !e.name.trim()) { toast("Nhập tên món trước"); return; }
      const rec = {sku: e.sku, name:e.name.trim(), group:"Món bếp", unit:e.unit||"phần",
        brand: (document.getElementById("f_brand")||{}).value || "",
        qty:0, min:0, kg:0, cost:0, price:e.price||0};
      mergeUp(DB.items, rec, "sku"); pushOutbox("item", rec); save();
      picked[rec.sku] = e.qty;
      extra.splice(+b.dataset.keep, 1);
      renderExtra(); renderQuick(); renderPicker(); recalc();
      toast("Đã lưu “"+rec.name+"” vào kho");
    });
    const ae = document.getElementById("addExtra");
    if(ae) ae.onclick = ()=>{
      extra.push({sku:"AD"+uid().slice(-5).toUpperCase(), name:"", qty:1, price:0, unit:"phần", note:""});
      renderExtra(); recalc();
      const last = document.querySelector("#extrabox .xline:last-of-type .xn"); if(last) last.focus();
    };
  }

  function recalc(){
    let s = 0, n = 0, kg = 0;
    Object.keys(picked).forEach(sku=>{
      const v = picked[sku]; if(!(v>0)) return;
      const it = DB.items.find(x=>x.sku===sku); if(!it) return;
      s += v * it.price; kg += v * itemKg(it); n++;
    });
    extra.forEach(e=>{ if(e.qty>0){ s += e.qty * (e.price||0); n++; } });

    /* tự chọn thương hiệu theo món trong đơn */
    const bsel = document.getElementById("f_brand"), bh = document.getElementById("brandhint");
    if(bsel && bh){
      const bs = [];
      Object.keys(picked).forEach(sku=>{
        if(!(picked[sku] > 0)) return;
        const b = itemBrand(DB.items.find(x=>x.sku===sku));
        if(b && bs.indexOf(b) < 0) bs.push(b);
      });
      if(bsel.dataset.touched !== "1" && bs.length === 1) bsel.value = bs[0];
      const info = BRANDINFO[bsel.value] || {};
      const pn = brandPaynow(bsel.value);
      bh.innerHTML = bs.length > 1
        ? '<span style="color:var(--warn)">⚠ Đơn có món của ' + bs.length + ' thương hiệu (' + bs.map(esc).join(", ") + ') — chọn đúng cái sẽ xuất bill, hoặc tách thành 2 đơn.</span>'
        : 'Bill sẽ ghi <b>' + esc(info.title || bsel.value) + '</b>' + (pn ? ' · thu tiền về <b>' + esc(pn) + '</b>' : ' · chưa đặt số nhận tiền cho brand này')
          + (bsel.dataset.touched !== "1" && bs.length === 1 ? ' · <span style="color:var(--accent)">tự chọn theo món</span>' : "");
    }
    s = +s.toFixed(2); kg = +kg.toFixed(2);
    const el = document.getElementById("sumline"); if(el) el.textContent = money(s);
    const c = document.getElementById("cntline");
    if(c) c.textContent = n ? n+" món" + (kg ? " · "+kgTxt(kg) : "") : "Chưa có món nào";

    /* nút thanh toán + ô cọc chỉ hiện khi chọn Đã cọc */
    const psel = document.getElementById("f_pay"), dw = document.getElementById("depwrap");
    if(psel && dw) dw.style.display = psel.value === "coc" ? "" : "none";

    /* GIẢM GIÁ — app không bao giờ tự áp, nhân viên tự gõ.
       Giảm % tính trên TIỀN HÀNG, phí giao hàng vẫn thu đủ. */
    {
      let ship = 0;
      Object.keys(picked).forEach(sku=>{
        const v = picked[sku]; if(!(v>0)) return;
        const it = DB.items.find(x=>x.sku===sku);
        if(it && isShipName(it.name)) ship += v * it.price;
      });
      extra.forEach(e=>{ if(e.qty>0 && isShipName(e.name)) ship += e.qty * (e.price||0); });
      ship = +ship.toFixed(2);
      const goods = Math.max(0, +(s - ship).toFixed(2));
      const pct = Math.min(100, Math.max(0, parseFloat((document.getElementById("f_dpct")||{}).value) || 0));
      const dpct = +(goods * pct / 100).toFixed(2);
      const md = Math.max(0, Math.min(parseFloat((document.getElementById("f_mdisc")||{}).value) || 0, Math.max(0, s - dpct)));
      const disc = +(dpct + md).toFixed(2);
      const net = Math.max(0, +(s - disc).toFixed(2));
      /* danh sách khuyến mãi chỉ để NHẮC nhân viên, không tự trừ */
      const list = eligiblePromos(document.getElementById("f_brand").value, s, kg);
      const kmhint = document.getElementById("kmhint");
      if(kmhint) kmhint.innerHTML = !list.length ? ""
        : '<span style="color:var(--warn)">💡 Đơn này đủ điều kiện: <b>' + list.map(x=>esc(x.p.name)).join("</b> · <b>")
          + '</b>. Muốn giảm thì tự gõ vào ô Giảm % hoặc Giảm thêm.</span>';
      const pv = psel ? psel.value : "chua";
      const isVnd = ((document.getElementById("f_vnd")||{}).value === "1");
      const rawDep = parseFloat((document.getElementById("f_deposit")||{}).value) || 0;
      const dep = pv === "coc" ? (isVnd ? sgdFromVnd(rawDep) : rawDep) : (pv === "da" ? net : 0);
      const cvb = document.getElementById("depconv");
      if(cvb) cvb.innerHTML = !rawDep ? ""
        : isVnd ? "= <b>" + money(sgdFromVnd(rawDep)) + "</b> (1 S$ = " + vnd(rate()).replace("₫","") + "₫)"
                : "= <b>" + vnd(vndFromSgd(rawDep)) + "</b>";
      const box = document.getElementById("totalbox");
      const row = (k,v,st)=> '<div style="display:flex;justify-content:space-between;font-size:13px;'+(st||"color:var(--ink-2)")+'"><span>'+k+'</span><span class="mono">'+v+'</span></div>';
      if(box) box.innerHTML =
        row("Tạm tính", money(s))
        + (ship ? row("Trong đó phí giao (không giảm)", money(ship)) : "")
        + (kg ? row("Cân nặng", kgTxt(kg)) : "")
        + (dpct ? row("Giảm " + pct + "% trên tiền hàng " + money(goods), "−"+money(dpct), "color:var(--accent)") : "")
        + (md ? row("Giảm thêm", "−"+money(md), "color:var(--accent)") : "")
        + '<div style="display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-top:6px"><span>Tổng đơn</span><span class="mono">'+money(net)+'</span></div>'
        + (pv === "da"
            ? '<div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:6px;color:var(--accent)"><span>Khách đã trả đủ</span><span class="mono">'+money(net)+'</span></div>'
            : row("Đã nhận", money(dep) + (isVnd && rawDep ? " (" + vnd(rawDep) + ")" : ""))
              + '<div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:4px;color:var(--danger)"><span>Còn phải thu</span><span class="mono">'+money(Math.max(0, +(net-dep).toFixed(2)))+'</span></div>'
              + (isVnd ? row("Tức là", vnd(vndFromSgd(Math.max(0, net-dep)))) : ""))
        ;
    }
  }
  function row(i){
    const on = picked[i.sku] > 0;
    return '<div class="pick'+(on?" on":"")+'" data-row="'+i.sku+'">'
      + '<div class="n">'+esc(i.name)+'<em>'+money(i.price)+' / '+i.unit+(i.qty?" · còn "+i.qty:"")+'</em></div>'
      + (on ? '<button type="button" class="mi" data-minus="'+i.sku+'">−</button>' : "")
      + '<input type="number" min="0" step="0.5" data-sku="'+i.sku+'" value="'+(on?picked[i.sku]:"")+'" placeholder="0">'
      + '</div>';
  }
  function renderPicker(){
    const box = document.getElementById("picker"); if(!box) return;
    const nq = norm(q);
    let html = "";
    const chosen = DB.items.filter(i=> picked[i.sku] > 0);
    if(chosen.length && !nq) html += '<div class="gtitle">Đã chọn</div>' + chosen.map(row).join("");
    allGroups().forEach(g=>{
      let its = DB.items.filter(i=> i.group===g);
      if(nq) its = its.filter(i=> norm(i.name).indexOf(nq) > -1);
      else its = its.filter(i=> !(picked[i.sku] > 0));
      if(!its.length) return;
      html += '<div class="gtitle">'+g+'</div>' + its.map(row).join("");
    });
    if(!html) html = '<div class="empty" style="padding:22px">Không tìm thấy món nào tên “'+esc(q)+'”.</div>';
    box.innerHTML = html;

    box.querySelectorAll(".pick").forEach(el=>{
      el.onclick = e=>{
        if(e.target.tagName === "INPUT" || e.target.closest("[data-minus]")) return;
        const sku = el.dataset.row;
        picked[sku] = +((picked[sku]||0) + 1).toFixed(2);
        renderPicker(); recalc();
      };
    });
    box.querySelectorAll("[data-minus]").forEach(b=>{
      b.onclick = ()=>{
        const sku = b.dataset.minus;
        picked[sku] = +((picked[sku]||0) - 1).toFixed(2);
        if(picked[sku] <= 0) delete picked[sku];
        renderPicker(); recalc();
      };
    });
    box.querySelectorAll("input[data-sku]").forEach(inp=>{
      inp.oninput = ()=>{
        const v = parseFloat(inp.value);
        if(v > 0) picked[inp.dataset.sku] = v; else delete picked[inp.dataset.sku];
        recalc();
      };
      inp.onblur = ()=> renderPicker();
    });
  }
  function renderQuick(){
    const box = document.getElementById("quickchips"); if(!box) return;
    box.innerHTML = topItems(12).map(i=> '<button type="button" class="qc" data-add="'+i.sku+'">'+esc(i.name)+'</button>').join("");
    box.querySelectorAll("[data-add]").forEach(b=> b.onclick = ()=>{
      const sku = b.dataset.add;
      picked[sku] = +((picked[sku]||0) + 1).toFixed(2);
      renderPicker(); recalc(); toast("+1 " + DB.items.find(x=>x.sku===sku).name);
    });
  }
  renderQuick(); renderExtra(); renderPicker(); recalc();

  /* nhắc địa chỉ còn thiếu gì, cập nhật ngay khi gõ */
  function drawAddrCheck(){
    const box = document.getElementById("addrcheck"); if(!box) return;
    const skip = (document.getElementById("f_noaddr")||{}).checked;
    const v = (document.getElementById("f_address")||{}).value || "";
    const foot = document.querySelectorAll("#dlgFoot .btn");
    const okBtn = foot[foot.length-1];
    if(skip || !v.trim()){
      box.innerHTML = skip ? "" : '<div class="addrmiss">Cần: <b>tên đường / toà nhà</b> · <b>số tầng</b> (#05-67 hoặc B2-38A) · <b>mã bưu chính 6 số</b></div>';
      if(okBtn){ okBtn.disabled = false; okBtn.style.opacity = ""; }
      return;
    }
    const ck = checkAddress(v);
    box.innerHTML = ck.ok
      ? '<div class="addrok">✓ Địa chỉ hợp lệ — xuất bill được</div>'
      : '<div class="addrmiss">⚠ Còn thiếu: <b>' + ck.miss.join("</b> · <b>") + '</b></div>';
    if(okBtn){ okBtn.disabled = !ck.ok; okBtn.style.opacity = ck.ok ? "" : ".45"; }
  }
  /* nhận ra khách quen theo số điện thoại, điền sẵn tên và địa chỉ */
  function lookupCustomer(auto){
    const box = document.getElementById("custhint"); if(!box) return;
    const ph = (document.getElementById("f_phone")||{}).value || "";
    const c = findCustomer(ph);
    if(!c || (o && o.phone === ph && !auto)){ box.innerHTML = ""; return; }
    const nameEl = document.getElementById("f_customer"), addrEl = document.getElementById("f_address");
    const nameEmpty = !nameEl.value.trim(), addrEmpty = !addrEl.value.trim();

    if(auto && (nameEmpty || addrEmpty)){
      if(nameEmpty && c.name) nameEl.value = c.name;
      if(addrEmpty && c.address) addrEl.value = c.address;
      drawAddrCheck();
      box.innerHTML = '<div class="custbox">✓ <b>Khách quen</b> — đã mua ' + c.n + ' lần, gần nhất ' + viDateFull(c.last)
        + '. Em điền sẵn tên và địa chỉ cũ.<span class="addr">' + esc(c.address || "—") + '</span></div>';
      return;
    }
    const same = norm(nameEl.value) === norm(c.name) && norm(addrEl.value) === norm(c.address);
    box.innerHTML = '<div class="custbox">✓ <b>' + esc(c.name || "Khách quen") + '</b> — đã mua ' + c.n
      + ' lần, tổng ' + money(c.spent) + ', gần nhất ' + viDateFull(c.last)
      + '<span class="addr">' + esc(c.address || "—") + '</span>'
      + (same ? "" : '<button type="button" id="useCust">Dùng lại tên và địa chỉ này</button>')
      + '</div>';
    const uc = document.getElementById("useCust");
    if(uc) uc.onclick = ()=>{
      if(c.name) nameEl.value = c.name;
      if(c.address) addrEl.value = c.address;
      drawAddrCheck(); lookupCustomer(false);
      toast("Đã điền lại theo lần trước");
    };
  }
  const ph = document.getElementById("f_phone");
  if(ph) ph.oninput = ()=>{ clearTimeout(ph._t); ph._t = setTimeout(()=> lookupCustomer(true), 350); };

  const ta = document.getElementById("f_address");
  if(ta) ta.oninput = drawAddrCheck;
  const na = document.getElementById("f_noaddr");
  if(na) na.onchange = drawAddrCheck;
  drawAddrCheck();
  if(o) lookupCustomer(false);

  const si = document.getElementById("isearch");
  if(si) si.oninput = ()=>{ q = si.value; renderPicker(); };
  const ke = document.getElementById("kmEdit");
  if(ke) ke.onclick = ()=>{
    if(ROLE !== "owner"){ toast("Chỉ chủ thêm/xoá được khuyến mãi"); return; }
    closeDialog(); setTimeout(()=>{ TAB = "set"; go("set");
      const el = document.querySelector("#addPromo"); if(el) el.scrollIntoView({block:"center"}); }, 200);
  };
  const mb = document.getElementById("f_brand");
  if(mb) mb.onchange = ()=>{ mb.dataset.touched = "1"; recalc(); };
  if(o) mb.dataset.touched = "1";
  const mdi = document.getElementById("f_mdisc");
  if(mdi) mdi.oninput = recalc;
  const dpc = document.getElementById("f_dpct");
  if(dpc) dpc.oninput = recalc;
  const dep = document.getElementById("f_deposit");
  if(dep) dep.oninput = recalc;
  /* gõ mã page vào ô mã → tự đổi thương hiệu */
  const ag = document.getElementById("f_agent");
  if(ag) ag.oninput = ()=>{
    const bnd = brandFromAgent(ag.value);
    if(bnd){ const bs = document.getElementById("f_brand"); bs.value = bnd; bs.dataset.touched = "1"; }
    recalc();
  };
  document.querySelectorAll("[data-cur]").forEach(btn=>{
    btn.onclick = ()=>{
      const toVnd = btn.dataset.cur === "vnd";
      const f = document.getElementById("f_deposit"), h = document.getElementById("f_vnd");
      const cur = parseFloat(f.value) || 0;
      if(cur){ f.value = toVnd ? vndFromSgd(cur) : sgdFromVnd(cur); }
      h.value = toVnd ? "1" : "";
      f.step = toVnd ? "1000" : "0.01";
      document.querySelectorAll("[data-cur]").forEach(x=> x.classList.toggle("on", x === btn));
      recalc();
    };
  });
  document.querySelectorAll("#paybtns .pb").forEach(btn=>{
    btn.onclick = ()=>{
      document.getElementById("f_pay").value = btn.dataset.pay;
      document.querySelectorAll("#paybtns .pb").forEach(x=> x.classList.toggle("on", x === btn));
      recalc();
      if(btn.dataset.pay === "coc"){ const f = document.getElementById("f_deposit"); if(f) f.focus(); }
    };
  });

  const bb = document.getElementById("dobulk");
  if(bb) bb.onclick = ()=>{
    const rows = document.getElementById("bulk").value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    let hit = 0, made = 0; const miss = [];
    rows.forEach(l=>{
      /* có ghi giá thì đọc như dòng trong tin nhắn, không thì dò trong kho */
      const ln = l.replace(/^(\d+(?:[.,]\d+)?)(kg|g|gr|ml|l)\b/i, "$1 $2 ");
      if(hasPrice(ln) && !NOT_ITEM_RE.test(ln)){
        const got = [];
        splitSegs(ln).forEach(sg=>{ const g = parseItemSeg(sg); if(g) got.push(g); });
        if(got.length){
          got.forEach(g=>{
            const it = matchItem(g.name);
            if(it && norm(it.name) === norm(g.name) && Math.abs(it.price - g.price) < 0.01){
              picked[it.sku] = +((picked[it.sku]||0) + g.qty).toFixed(2); hit++;
            }else{
              extra.push({sku:"AD"+uid().slice(-5).toUpperCase(), name:g.name, qty:g.qty,
                price:g.price, unit: g.unit || (it ? it.unit : "phần"), note:g.note});
              made++;
            }
          });
          return;
        }
      }
      const r = parseLine(l);
      if(r){ picked[r.item.sku] = +((picked[r.item.sku]||0) + r.qty).toFixed(2); hit++; }
      else miss.push(l);
    });
    renderExtra(); renderPicker(); recalc();
    const bits = [];
    if(hit) bits.push(hit + " món khớp kho");
    if(made) bits.push(made + " món tự gõ");
    toast(bits.length ? "Đã thêm " + bits.join(" · ") + (miss.length ? " · " + miss.length + " dòng không nhận ra" : "")
                      : "Không nhận ra dòng nào");
    document.getElementById("bulk").value = miss.join("\n");
  };

  const dp = document.getElementById("doparse");
  let lastRaw = "";           /* chặn đọc hai lần cùng một tin nhắn → khỏi nhân đôi món */
  const runParse = (auto)=>{
    const raw = document.getElementById("paste").value;
    if(!raw.trim()){ if(!auto) toast("Dán tin nhắn vào ô trên đã"); return; }
    if(raw.trim() === lastRaw) return;
    lastRaw = raw.trim();
    const p = parseOrderMsg(raw);
    if(p.customer) $("#f_customer").value = p.customer;
    if(p.agent)    $("#f_agent").value = p.agent;
    if(p.brand){ $("#f_brand").value = p.brand; $("#f_brand").dataset.touched = "1"; }
    if(p.phone)    $("#f_phone").value = p.phone;
    if(p.address)  $("#f_address").value = p.address;
    drawAddrCheck();
    lookupCustomer(true);
    if(p.odate)    $("#f_odate").value = p.odate;
    if(p.date)     $("#f_date").value = p.date;
    if(p.deposit){
      if(p.vnd){
        $("#f_vnd").value = "1"; $("#f_deposit").value = p.depositVnd; $("#f_deposit").step = "1000";
        document.querySelectorAll("[data-cur]").forEach(x=> x.classList.toggle("on", x.dataset.cur === "vnd"));
      }else{
        $("#f_deposit").value = p.deposit;
      }
    }
    if(p.note)     $("#f_note").value = p.note;
    if(p.pay){
      $("#f_pay").value = p.pay;
      document.querySelectorAll("#paybtns .pb").forEach(x=> x.classList.toggle("on", x.dataset.pay === p.pay));
    }
    if(p.payMethod) $("#f_method").value = p.payMethod;

    let hit = 0, made = 0;
    p.lines.forEach(l=>{
      const it = matchItem(l.name);
      /* chỉ dùng món trong kho khi tên trùng khít và giá cũng khớp — còn lại giữ nguyên chữ nhân viên ghi */
      if(it && norm(it.name) === norm(l.name) && (!l.price || Math.abs(it.price - l.price) < 0.01)){
        picked[it.sku] = +((picked[it.sku]||0) + l.qty).toFixed(2); hit++;
      }else{
        extra.push({sku:"AD"+uid().slice(-5).toUpperCase(), name:l.name, qty:l.qty,
          price:l.price, unit: l.unit || (it ? it.unit : "phần"), note:l.note});
        made++;
      }
    });
    renderExtra(); renderPicker(); recalc();
    const bits = [];
    if(hit) bits.push(hit + " món khớp kho");
    if(made) bits.push(made + " món tự gõ");
    if(p.agent) bits.push("NV " + p.agent);
    if(p.vnd) bits.push("cọc " + vnd(p.depositVnd) + " = " + money(p.deposit));
    if(p.pay) bits.push(PAY[p.pay] + (p.deposit ? " " + money(p.deposit) : ""));
    if(p.payMethod) bits.push(p.payMethod);
    if(p.freeship) bits.push("freeship");
    toast("Đã đọc xong" + (bits.length ? " · " + bits.join(" · ") : "") + " — kiểm tra lại giúp em");
  };
  if(dp) dp.onclick = ()=> runParse(false);
  /* Dán một lần là app tự đọc — nhân viên không phải bấm thêm nút nào */
  const pasteBox = document.getElementById("paste");
  if(pasteBox){
    pasteBox.addEventListener("paste", ()=>{ setTimeout(()=> runParse(true), 60); });
    /* điện thoại có bàn phím tự điền / kéo thả: chữ vào một lượt dài cũng tự đọc */
    let tmr = null, was = pasteBox.value.length;
    pasteBox.addEventListener("input", ()=>{
      const now = pasteBox.value.length, jump = now - was; was = now;
      if(jump < 25) return;
      clearTimeout(tmr); tmr = setTimeout(()=> runParse(true), 250);
    });
  }
}

/* ---- chi tiết đơn ---- */
function orderDetail(id){
  const o = DB.orders.find(x=>x.id===id); if(!o) return;
  const sub = orderTotal(o), disc = orderDisc(o), total = orderNet(o), remain = total - (o.deposit||0);
  const kg = orderKg(o);
  const rows = (o.items||[]).map(i=>{
    const it = DB.items.find(x=>x.sku===i.sku);
    const parts = isCombo(it) ? '<span class="s">gồm '+it.parts.map(pp=>{ const c=DB.items.find(x=>x.sku===pp.sku); return (pp.qty*i.qty)+"× "+(c?c.name:pp.sku); }).join(", ")+'</span>' : "";
    return '<tr><td>'+esc(i.name)+'<span class="s">'+i.qty+' '+i.unit+' × '+money(i.price)+(i.kg?' · '+kgTxt(i.qty*i.kg):'')+'</span>'
      + (i.note?'<span class="s" style="color:var(--warn)">→ '+esc(i.note)+'</span>':'')+parts+'</td><td class="mono">'+money(i.qty*i.price)+'</td></tr>';
  }).join("");

  openDialog("Đơn "+orderCode(o), `
    <div class="stat wide" style="margin-bottom:14px">
      <div class="k">Khách</div>
      <div class="v" style="font-size:19px">${esc(o.customer||"Khách lẻ")}</div>
      <div class="sub">${esc(o.phone||"—")} · ${esc(o.brand)} · giao ${viDate(o.date)}${o.time?" lúc "+o.time:""}${o.odate?" · đặt "+viDateFull(o.odate):""}${o.agent?" · NV "+esc(o.agent):""}</div>
    </div>
    <div class="note" style="margin-bottom:14px">${esc(o.address||"Chưa có địa chỉ")}</div>
    ${o.note ? '<div class="note" style="margin-bottom:14px">📝 '+esc(o.note)+'</div>' : ""}

const T = {
  vi:{bill:"Số bill", odate:"Ngày đặt", ddate:"Ngày giao", cust:"Khách", staff:"MNV", phone:"Điện thoại",
      to:"Giao đến", item:"MÓN", qty:"SL", amt:"THÀNH TIỀN", weight:"Tổng cân nặng", sub:"Tạm tính",
      promo:"Khuyến mãi", disc:"Giảm", refund:"Trả lại", total:"Tổng cộng", dep:"Đã cọc",
      due:"Còn lại", invnd:"Tiền Việt", pay:"Thanh toán", note:"Ghi chú",
      scan:"Quét mã để trả", contact:"Liên hệ Pages", dshort:"giao", oshort:"đặt",
      pays:{chua:"Chưa thu", coc:"Đã cọc", da:"Đã thu đủ"},
      thanks:"Thank you for your order", thanks2:"Chúc quý khách dùng ngon miệng"},
  en:{bill:"Bill No.", odate:"Order date", ddate:"Delivery date", cust:"Customer", staff:"Staff", phone:"Phone",
      to:"Deliver to", item:"ITEM", qty:"QTY", amt:"AMOUNT", weight:"Total weight", sub:"Subtotal",
      promo:"Promotion", disc:"Discount", refund:"Refund", total:"TOTAL", dep:"Deposit paid",
      due:"Balance due", invnd:"In VND", pay:"Payment", note:"Note",
      scan:"Scan to pay", contact:"Contact us", dshort:"delivery", oshort:"ordered",
      pays:{chua:"Unpaid", coc:"Deposit paid", da:"Paid in full"},
      thanks:"Thank you for your order", thanks2:"Enjoy your meal!"}
};
function billLang(o){ return o.lang === "en" ? "en" : "vi"; }
function tx(o){ return T[billLang(o)]; }
/* nhãn dòng giảm giá trên bill — theo ngôn ngữ bill */
function discLabel(o, t){
  if(o && o.discPct > 0) return t.disc + " " + o.discPct + "%";
  return (o && o.promoName) || t.promo;
}
function payTxt(o){ return tx(o).pays[o.pay]; }

/* ---- BILL CHO KHÁCH ---- */
function viDateFull(s){ const [y,m,d]=String(s||todayStr()).split("-"); return d+"/"+m+"/"+y; }
/* số nhận tiền của từng thương hiệu, không có thì dùng số chung */
function brandPaynow(brand){
  const by = (DB.bill && DB.bill.byBrand) || {};
  return (by[brand] || "").trim() || ((BRANDINFO[brand]||{}).paynow || "").trim() || (DB.bill.paynow || "").trim();
}

function billText(o){
  const bi = BRANDINFO[o.brand] || {title:o.brand, uen:"", pages:[]};
  const t = tx(o), en = billLang(o) === "en";
  const sub = orderTotal(o), disc = orderDisc(o), total = orderNet(o), dep = o.deposit||0, kg = orderKg(o);
  const R = [];
  R.push("🧾 " + bi.title);
  R.push(t.bill + " " + orderCode(o) + " · " + t.dshort + " " + viDateFull(o.date) + (o.time ? " " + o.time : "")
    + (o.odate ? " · " + t.oshort + " " + viDateFull(o.odate) : ""));
  R.push(t.cust + ": " + (o.customer || (en?"Walk-in":"Khách lẻ")) + (o.phone ? " · " + o.phone : ""));
  if(o.agent) R.push(t.staff + ": " + o.agent);
  if(o.address) R.push(t.to + ": " + o.address);
  R.push("——————————");
  (o.items||[]).forEach(i=> R.push("• " + i.name + " — " + i.qty + " " + i.unit + " × " + money(i.price) + " = " + money(i.qty*i.price)
    + (i.note ? "\n   → " + i.note : "")));
  R.push("——————————");
  if(kg) R.push(t.weight + ": " + kgTxt(kg));
  if(disc){
    R.push(t.sub + ": " + money(sub));
    if(o.discount) R.push(discLabel(o,t) + ": −" + money(o.discount));
    if(o.manualDiscount) R.push(t.disc + (o.discountNote ? " (" + o.discountNote + ")" : "") + ": −" + money(o.manualDiscount));
  }
  (o.returns||[]).forEach(r=> R.push(t.refund + (r.reason ? " (" + r.reason + ")" : "") + ": −" + money(r.amount)));
  R.push(t.total.toUpperCase() + ": " + money(total));
  if(dep){
    R.push(t.dep + ": −" + money(dep) + (o.vnd && o.depositVnd ? " (" + vnd(o.depositVnd) + ")" : ""));
    R.push(t.due.toUpperCase() + ": " + money(total - dep));
  }
  if(o.vnd && (total - dep) > 0) R.push(t.invnd + ": " + vnd(vndFromSgd(total - dep)));
  R.push(t.pay + ": " + (!o.payMethod || o.payMethod==="Chưa chọn" ? "" : o.payMethod + " · ") + payTxt(o));
  if(brandPaynow(o.brand)) R.push("PayNow: " + brandPaynow(o.brand));
  if(brandQR(o.brand) && o.pay !== "da") R.push(en ? "(Printed bill has a PayNow QR to scan)" : "(Bill in ra có mã QR PayNow để quét)");
  if(o.note) R.push(t.note + ": " + o.note);
  R.push("");
  R.push(en ? t.thanks : (DB.bill.thanks || t.thanks));
  R.push(en ? t.thanks2 : (DB.bill.thanks2 || ""));
  R.push("");
  R.push(t.contact);
  bi.pages.forEach(p=> R.push(p));
  return R.join("\n");
}

/* ---- HÀNG HƯ / TRẢ LẠI: trừ tiền rồi xuất lại bill cho khách ---- */
function returnDialog(id){
  const o = DB.orders.find(x=>x.id===id); if(!o) return;
  const net = orderNet(o);
  openDialog("Hàng hư / trả lại — " + orderCode(o), `
    <div class="note" style="margin-bottom:14px"><b>${esc(o.customer||"Khách lẻ")}</b> · giao ${viDate(o.date)} · đang là <b>${money(net)}</b></div>
    <div class="sec-h"><h2>Chọn món trả lại</h2></div>
    <div id="rt_items">${(o.items||[]).map((i,ix)=>
      '<div class="xline" data-ix="'+ix+'">'
      + '<span class="xn" style="flex:1;font-size:13.5px;padding:9px 0">'+esc(i.name)+'<br><span style="font-size:11.5px;color:var(--ink-3)">'+i.qty+' '+esc(i.unit)+' × '+money(i.price)+'</span></span>'
      + '<input class="xq mono" type="number" min="0" max="'+i.qty+'" step="0.5" value="" placeholder="0" data-ret="'+ix+'">'
      + '</div>').join("")}</div>
    <div class="field" style="margin-top:14px"><label>Hoặc nhập thẳng số tiền trả lại</label><input type="number" step="0.01" min="0" id="rt_amt" placeholder="0.00"></div>
    <div class="field"><label>Lý do</label><input id="rt_why" placeholder="Vd: sầu riêng bị sượng, khách trả lại 1 hộp"></div>
    <div class="card" style="padding:12px" id="rt_sum"></div>
    <div class="note" style="margin-top:10px">Sau khi lưu, mở lại bill là ra <b>bill mới đã trừ tiền</b> để đưa khách tất toán. Mã bill vẫn giữ nguyên ${esc(orderCode(o))}.</div>
  `, [
    {label:"Huỷ", cls:"ghost", fn:null},
    {label:"Lưu và xuất bill mới", cls:"", fn:()=>{
      const amt = calcRet();
      if(!(amt > 0)){ toast("Nhập số lượng trả lại hoặc số tiền"); return false; }
      const why = document.getElementById("rt_why").value.trim();
      if(!why){ toast("Ghi lý do giúp em"); return false; }
      o.returns = o.returns || [];
      o.returns.push({at:nowStamp(), amount:+amt.toFixed(2), reason:why, by:WHO + (lastAgent()?" "+lastAgent():"")});
      if(orderNet(o) <= 0 && o.pay !== "da") o.pay = "da";
      mergeUp(DB.orders, o, "id"); pushOutbox("order", o); save(); renderAll();
      setTimeout(()=> billDialog(o.id), 150);
      toast("Đã trừ " + money(amt) + " — bill mới sẵn sàng");
    }}
  ]);

  function calcRet(){
    let a = parseFloat(document.getElementById("rt_amt").value) || 0;
    document.querySelectorAll("[data-ret]").forEach(inp=>{
      const q = parseFloat(inp.value) || 0;
      if(q > 0){ const i = o.items[+inp.dataset.ret]; a += q * i.price; }
    });
    return a;
  }
  function drawSum(){
    const a = calcRet(), after = Math.max(0, +(net - a).toFixed(2));
    document.getElementById("rt_sum").innerHTML =
      '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)"><span>Bill hiện tại</span><span class="mono">'+money(net)+'</span></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--danger)"><span>Trả lại</span><span class="mono">−'+money(a)+'</span></div>'
      + '<div style="display:flex;justify-content:space-between;font-weight:700;font-size:17px;margin-top:6px"><span>Bill mới</span><span class="mono">'+money(after)+'</span></div>';
  }
  document.querySelectorAll("[data-ret]").forEach(i=> i.oninput = drawSum);
  document.getElementById("rt_amt").oninput = drawSum;
  drawSum();
}

    <div class="note" style="margin-bottom:14px;border-color:var(--danger);background:var(--danger-soft)">

  `, [
    {label:"Không huỷ", cls:"ghost", fn:null},
    {label:"Xác nhận huỷ", cls:"danger", fn:()=>{

/* ---- VẼ BILL THÀNH ẢNH ĐỂ NHÂN VIÊN LƯU VÀ GỬI KHÁCH ---- */
function loadImg(src){
  return new Promise(res=>{
    if(!src) return res(null);
    let done = false;
    const fin = v=>{ if(!done){ done = true; res(v); } };
    const im = new Image();
    im.onload = ()=> fin(im);
    im.onerror = ()=> fin(null);
    setTimeout(()=> fin(null), 6000);   /* ảnh không tải nổi thì đừng treo nút */
    im.src = src;
  });
}
async function billImage(o){
  const S = 2;                       // vẽ gấp đôi cho ảnh nét
  const W = 620, PAD = 40;
  const bi = BRANDINFO[o.brand] || {title:o.brand, uen:"", pages:[]};
  const t = tx(o), en = billLang(o) === "en";
  const sub = orderTotal(o), disc = orderDisc(o), total = orderNet(o);
  const dep = o.deposit || 0, remain = total - dep, kg = orderKg(o);
  const [logo, qr] = await Promise.all([loadImg(brandLogo(o.brand)),
                                        loadImg(o.pay !== "da" ? brandQR(o.brand) : "")]);

  /* Khung vẽ phải co giãn theo số món — đơn nhiều món mà khung cố định
     thì bill vẽ tràn ra ngoài, ảnh ra trắng hoặc hỏng, không lưu được. */
  const nRows = (o.items || []).length + (o.returns || []).length;
  const CH = Math.min(6000, Math.max(1600, 1100 + nRows * 110 + (o.note ? 160 : 0)));
  const cv = document.createElement("canvas");
  cv.width = W * S; cv.height = Math.round(CH * S);
  const c = cv.getContext("2d");
  c.scale(S, S);
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, W, CH);
  c.textBaseline = "top";

  const SANS = '"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const INK = "#12100e", GREY = "#6b6a66", LINE = "#d5d1cb";
  let y = PAD;

  function dash(){
    c.strokeStyle = LINE; c.lineWidth = 1; c.setLineDash([4,4]);
    c.beginPath(); c.moveTo(PAD, y + 0.5); c.lineTo(W - PAD, y + 0.5); c.stroke();
    c.setLineDash([]); y += 14;
  }
  function kvRow(k, v, opt){
    opt = opt || {};
    const sz = opt.size || 13, wt = opt.bold ? "700 " : "";
    c.font = wt + sz + "px " + SANS;              /* nhãn luôn dùng font có dấu đầy đủ */
    c.fillStyle = opt.grey ? GREY : INK; c.textAlign = "left";
    c.fillText(k, PAD, y);
    c.font = wt + sz + "px " + (opt.mono ? MONO : SANS);
    c.fillStyle = opt.vcolor || INK; c.textAlign = "right";
    c.fillText(v, W - PAD, y);
    y += sz + 8;
  }
  function wrap(txt, size, color, align, maxW){
    c.font = size + "px " + SANS; c.fillStyle = color; c.textAlign = align;
    const x = align === "center" ? W/2 : PAD;
    const words = String(txt).split(/\s+/); let ln = "";
    words.forEach(w=>{
      const t = ln ? ln + " " + w : w;
      if(c.measureText(t).width > (maxW || W - PAD*2) && ln){ c.fillText(ln, x, y); y += size + 5; ln = w; }
      else ln = t;
    });
    if(ln){ c.fillText(ln, x, y); y += size + 5; }
  }

  if(logo){
    const h = 86, w = logo.width / logo.height * h;
    c.drawImage(logo, (W - w)/2, y, w, h); y += h + 12;
  }
  c.textAlign = "center";
  c.font = "800 26px " + SANS; c.fillStyle = INK;
  c.fillText(bi.title, W/2, y); y += 32;
  c.font = "12px " + SANS; c.fillStyle = GREY;
  c.fillText(bi.uen, W/2, y); y += 22;
  dash();

  kvRow(t.bill, orderCode(o), {grey:true, mono:true});
  if(o.odate) kvRow(t.odate, viDateFull(o.odate), {grey:true, mono:true});
  kvRow(t.ddate, viDateFull(o.date) + (o.time ? " " + o.time : ""), {grey:true, mono:true});
  kvRow(t.cust, o.customer || (en?"Walk-in":"Khách lẻ"), {grey:true});
  if(o.agent) kvRow(t.staff, o.agent, {grey:true});
  if(o.phone) kvRow(t.phone, o.phone, {grey:true, mono:true});
  if(o.address){
    c.textAlign = "left"; c.font = "12px " + SANS; c.fillStyle = GREY;
    c.fillText(t.to, PAD, y); y += 18;
    wrap(o.address, 13, INK, "left");
    y += 4;
  }
  dash();

  c.textAlign = "left"; c.font = "700 11px " + SANS; c.fillStyle = GREY;
  c.fillText(t.item, PAD, y);
  c.textAlign = "center"; c.fillText(t.qty, W - PAD - 150, y);
  c.textAlign = "right"; c.fillText(t.amt, W - PAD, y);
  y += 20;
  (o.items||[]).forEach(i=>{
    c.textAlign = "left"; c.font = "13px " + SANS; c.fillStyle = INK;
    c.fillText(i.name.length > 34 ? i.name.slice(0,33) + "…" : i.name, PAD, y);
    c.textAlign = "center"; c.font = "12px " + SANS; c.fillStyle = GREY;
    c.fillText(i.qty + " " + i.unit, W - PAD - 150, y);
    c.textAlign = "right"; c.font = "13px " + MONO; c.fillStyle = INK;
    c.fillText(money(i.qty * i.price), W - PAD, y);
    y += 19;
    if(i.note){
      c.textAlign = "left"; c.font = "12px " + SANS; c.fillStyle = "#b26a12";
      c.fillText("→ " + i.note, PAD + 8, y); y += 18;
    }
  });
  y += 4; dash();

  if(kg) kvRow(t.weight, kgTxt(kg), {grey:true, mono:true});
  if(disc){
    kvRow(t.sub, money(sub), {grey:true, mono:true});
    if(o.discount) kvRow(discLabel(o,t), "−" + money(o.discount), {grey:true, mono:true, vcolor:"#0e7c5a"});
    if(o.manualDiscount) kvRow(t.disc + (o.discountNote ? " (" + o.discountNote + ")" : ""), "−" + money(o.manualDiscount), {grey:true, mono:true, vcolor:"#0e7c5a"});
  }
  (o.returns||[]).forEach(r=> kvRow(t.refund + (r.reason ? " (" + r.reason + ")" : ""), "−" + money(r.amount), {grey:true, mono:true, vcolor:"#b23a2e"}));
  kvRow(t.total, money(total), {bold:true, size:17, mono:false});
  if(dep){
    kvRow(t.dep + (o.vnd && o.depositVnd ? " (" + vnd(o.depositVnd) + ")" : ""), "−" + money(dep), {grey:true, mono:true});
    kvRow(t.due, money(remain), {bold:true, size:17, vcolor:"#b23a2e"});
  }
  if(o.vnd && remain > 0) kvRow(t.invnd, vnd(vndFromSgd(remain)), {grey:true});
  kvRow(t.pay, (!o.payMethod || o.payMethod === "Chưa chọn" ? "" : o.payMethod + " · ") + payTxt(o), {grey:true});
  if(brandPaynow(o.brand)){
    c.textAlign = "left"; c.font = "12px " + SANS; c.fillStyle = GREY;
    c.fillText("PayNow", PAD, y); y += 17;
    wrap(brandPaynow(o.brand), 12.5, INK, "left");
  }
  if(o.note){ y += 4; wrap(t.note + ": " + o.note, 12.5, GREY, "left"); }
  y += 6; dash();

  if(qr){
    const s = 190;
    c.drawImage(qr, (W - s)/2, y - 6, s, s); y += s + 2;
    c.textAlign = "center"; c.font = "12px " + SANS; c.fillStyle = GREY;
    c.fillText(t.scan + " " + money(remain), W/2, y); y += 24;
  }
  c.textAlign = "center"; c.font = "700 15px " + SANS; c.fillStyle = INK;
  c.fillText(en ? t.thanks : (DB.bill.thanks || t.thanks), W/2, y); y += 22;
  const th2 = en ? t.thanks2 : (DB.bill.thanks2 || "");
  if(th2){
    c.font = "13px " + SANS; c.fillStyle = INK;
    c.fillText(th2, W/2, y); y += 24;
  }
  y += 4; dash();
  c.font = "11.5px " + SANS; c.fillStyle = GREY; c.textAlign = "center";
  (bi.pages||[]).forEach(p=>{ c.fillText(p, W/2, y); y += 17; });
  y += PAD;

  /* cắt đúng chiều cao đã dùng — không được vượt khung đã vẽ */
  const out = document.createElement("canvas");
  out.width = W * S; out.height = Math.round(Math.min(y, CH) * S);
  const oc = out.getContext("2d");
  oc.fillStyle = "#ffffff"; oc.fillRect(0, 0, out.width, out.height);
  oc.drawImage(cv, 0, 0);
  return out;
}

/* hiện ảnh bill để nhân viên nhấn giữ rồi lưu về máy */
function showBillImage(dataUrl, o, blob, fname){
  /* iPhone: cách chắc ăn nhất là mở bảng Chia sẻ rồi bấm "Lưu vào Ảnh" */
  let canShare = false, file = null;
  try{
    if(blob && window.File && navigator.canShare){
      file = new File([blob], fname || ("Bill-" + orderCode(o) + ".png"), {type:"image/png"});
      canShare = navigator.canShare({files:[file]});
    }
  }catch(e){ canShare = false; }

  const acts = [{label:"Xong", cls:"ghost", fn:null}];
  if(canShare) acts.push({label:"📤 Lưu / Gửi ảnh", cls:"", fn:()=>{
    navigator.share({files:[file]}).catch(()=>{});
    return false;
  }});

  openDialog("Ảnh bill " + orderCode(o), `
    <div class="note" style="margin-bottom:12px;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)">
      ${canShare
        ? '<b>📱 Bấm 📤 Lưu / Gửi ảnh</b> ở thanh dưới → chọn <b>"Lưu vào Ảnh"</b> để cất máy, hoặc chọn thẳng Zalo / WhatsApp / Messenger để gửi khách liền.'
        : '<b>📱 Điện thoại:</b> nhấn giữ vào ảnh dưới → <b>"Lưu vào ảnh"</b>.<br><b>💻 Máy tính:</b> bấm chuột phải vào ảnh → <b>"Lưu hình ảnh thành..."</b>'}
    </div>
    <img src="${dataUrl}" alt="Bill ${esc(orderCode(o))}"
      style="width:100%;border:1px solid var(--line);border-radius:12px;display:block">
  `, acts);
}

function canvasBlob(cv){
  return new Promise(res=> cv.toBlob(b=> res(b), "image/png"));
}

/* Đơn đang mở bill. Nút "Lưu ảnh bill" bắt sự kiện ở cấp hộp thoại (bên dưới)
   chứ không gắn thẳng vào nút — iPhone hay làm mất hàm gắn thẳng khi hộp
   thoại vẽ lại, khiến bấm nút không ăn gì cả.                              */
let BILL_NOW = null, BILL_BUSY = false;

async function saveBillImage(o, btn){
  if(!o) o = BILL_NOW;
  if(!o){ toast("Chưa mở bill nào"); return; }
  if(BILL_BUSY) return;               /* chống bấm hai lần ra hai ảnh */
  BILL_BUSY = true;
  const lbl = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Đang tạo ảnh…"; }
  try{
    const cv = await billImage(o);
    const blob = await canvasBlob(cv);
    const name = "Bill-" + orderCode(o).replace("#","") + "-"
      + (o.customer || "khach").replace(/[^\p{L}\p{N}]+/gu, "-").slice(0, 24) + ".png";
    let dl = null;
    try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
    if(dl && blob){
      await dl.save({filename:name, data:blob});
      toast("Đã lưu ảnh bill — gửi cho khách được rồi");
      return;
    }
    /* không tải thẳng được thì hiện ảnh ra, nhấn giữ để lưu.
       iPhone: ảnh dạng data: dài vài MB hay không chịu hiện — dùng blob trước. */
    let url = "";
    if(blob && window.URL && URL.createObjectURL){
      try{ url = URL.createObjectURL(blob); }catch(e){ url = ""; }
    }
    if(!url){ try{ url = cv.toDataURL("image/png"); }catch(e){ url = ""; } }
    if(!url || url.length < 30){ toast("Máy không tạo được ảnh — dùng nút 🖨 In hoặc 📋 Chép"); return; }
    showBillImage(url, o, blob, name);
  }catch(err){
    const code = err && err.code;
    if(code === "declined") toast("Chưa lưu — bấm đồng ý khi app hỏi");
    else if(code === "rate_limited") toast("Đang có hộp thoại lưu khác, thử lại sau vài giây");
    else if(code === "too_large") toast("Ảnh lớn quá");
    else toast("Không lưu được ảnh: " + ((err && err.message) || "lỗi lạ") + " — dùng nút Chép bill");
  }finally{
    BILL_BUSY = false;
    if(btn){ btn.disabled = false; btn.textContent = lbl || "💾 Lưu ảnh bill"; }
  }
}

function billDialog(id){
  const o = DB.orders.find(x=>x.id===id); if(!o) return;
  openDialog("Bill "+orderCode(o),
    '<div class="langwrap">'
    + '<button type="button" class="lng'+(billLang(o)==="vi"?" on":"")+'" data-lang="vi">🇻🇳 Tiếng Việt</button>'
    + '<button type="button" class="lng'+(billLang(o)==="en"?" on":"")+'" data-lang="en">🇸🇬 English</button>'
    + '</div>'
    + '<button type="button" class="btn" id="b_img" style="width:100%;margin-bottom:10px">💾 Lưu ảnh bill</button>'
    + '<div class="note" style="margin-bottom:12px;border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)">'
    + 'Bấm <b>💾 Lưu ảnh bill</b> ngay trên đây → ảnh hiện ra → <b>nhấn giữ vào ảnh</b> → <b>Lưu vào ảnh</b> → gửi cho khách.</div>'
    + '<div id="billbox">' + billHTML(o) + '</div>'
    + '<div class="note" style="margin-top:10px">Muốn gửi bằng chữ thì bấm <b>Chép bill</b>. Muốn in ra giấy thì bấm <b>In</b>. Hai nút đó cũng ở thanh dưới.</div>', [
    {label:"📋 Chép bill", cls:"ghost", fn:()=>{
      const t = billText(o);
      if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Đã chép bill — dán vào chat gửi khách"), ()=>toast("Không chép được"));
      else toast("Không chép được");
      return false;
    }},
    {label:"🖨 In / Lưu PDF", cls:"", fn:()=>{
      const pa = document.getElementById("printarea");
      pa.innerHTML = billHTML(o);
      try{ window.print(); }
      catch(e){ toast("Trình duyệt chặn in — dùng nút Chép bill"); }
      return false;
    }}
  ]);
  /* Ghi nhớ đơn đang mở bill — để nút Lưu ảnh còn chạy được kể cả khi
     hộp thoại vẽ lại (đổi tiếng Việt / English) làm mất hàm gắn trực tiếp. */
  BILL_NOW = o;
  const bimg = document.getElementById("b_img");
  if(bimg) bimg.onclick = ()=> saveBillImage(o, bimg);
  document.querySelectorAll("[data-lang]").forEach(btn=>{
    btn.onclick = ()=>{
      o.lang = btn.dataset.lang;
      mergeUp(DB.orders, o, "id"); pushOutbox("order", o); save();
      document.querySelectorAll("[data-lang]").forEach(x=> x.classList.toggle("on", x === btn));
      document.getElementById("billbox").innerHTML = billHTML(o);
      toast(o.lang === "en" ? "Bill switched to English" : "Bill chuyển sang tiếng Việt");
    };
  });
}

function deductStock(o){
  orderParts(o).forEach(i=>{
    const it = DB.items.find(x=>x.sku===i.sku);
    if(it && it.group!=="Dịch vụ" && !isCombo(it)){ it.qty = Math.max(0, +(it.qty - i.qty).toFixed(2)); pushOutbox("item", it); }
  });
}

/* ============== 6b. SOẠN ĐƠN (VAI TRÒ KHO) ============== */
function toPrep(){
  return DB.orders.filter(o => o.status!=="xong" && o.status!=="huy" && (o.prep||"chua")!=="du");
}

let PF = "left";
function viewPrep(){
  const t = todayStr(); const tm = new Date(); tm.setDate(tm.getDate()+1); const tmr = todayStr(tm);
  let list = DB.orders.filter(o => o.status!=="huy").sort((a,b)=> (a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")));
  if(PF==="today")  list = list.filter(o=> o.date<=t && (o.prep||"chua")!=="du" && o.status!=="xong");
  if(PF==="tmr")    list = list.filter(o=> o.date===tmr);
  if(PF==="left")   list = list.filter(o=> (o.prep||"chua")!=="du" && o.status!=="xong");
  if(PF==="du")     list = list.filter(o=> o.prep==="du");

  /* gom tất cả món trong các đơn đang lọc thành một danh sách chuẩn bị */
  const need = {};
  list.filter(o=> (o.prep||"chua")!=="du").forEach(o=> orderParts(o).forEach(i=>{
    need[i.sku] = need[i.sku] || {name:i.name, unit:i.unit, qty:0};
    need[i.sku].qty = +(need[i.sku].qty + i.qty).toFixed(2);
  }));
  const needList = Object.keys(need).map(sku=>{
    const it = DB.items.find(x=>x.sku===sku);
    const have = it ? it.qty : 0;
    /* món nấu theo đơn và dịch vụ thì không tính thiếu kho */
    const nostock = !it || it.group==="Dịch vụ" || (it.min===0 && it.qty===0);
    return {sku, ...need[sku], have, short: +(need[sku].qty - have).toFixed(2), nostock};
  }).sort((a,b)=> b.short - a.short);
  const shortList = needList.filter(x=> !x.nostock && x.short > 0);

  const chips = [["left","Tất cả chưa soạn"],["today","Cần soạn hôm nay"],["tmr","Ngày mai"],["du","Đã soạn xong"]];

  $("#v-prep").innerHTML =
    '<button class="btn" id="openManifest" style="margin-bottom:12px">📋 Danh sách soạn đơn theo ngày giao</button>'
    + '<div class="statgrid" style="margin-bottom:14px">'
    + '<div class="stat"><div class="k">Đơn chưa soạn</div><div class="v mono">'+toPrep().length+'</div><div class="sub">trên tất cả các ngày</div></div>'
    + '<div class="stat'+(shortList.length?" alert":"")+'"><div class="k">Mặt hàng thiếu</div><div class="v mono">'+shortList.length+'</div><div class="sub">'+(shortList.length?"cần mua gấp":"kho đủ hàng")+'</div></div>'
    + '</div>'
    + '<div class="filters">'+chips.map(c=>'<button class="fchip'+(PF===c[0]?" on":"")+'" data-p="'+c[0]+'">'+c[1]+'</button>').join("")+'</div>'

    + (needList.length ? '<div class="sec"><div class="sec-h"><h2>Tổng hàng cần chuẩn bị</h2><span class="spacer"></span><span class="count">'+needList.length+' mặt hàng</span></div>'
        + '<div class="card"><table class="tbl">'
        + needList.map(x=> '<tr><td>'+esc(x.name)+'<span class="s">'+(x.nostock?"làm theo đơn — không trừ kho":"kho còn "+x.have+" "+x.unit)+'</span></td>'
          + '<td class="mono"'+((!x.nostock && x.short>0)?' style="color:var(--danger)"':'')+'>'+x.qty+' '+esc(x.unit)+(!x.nostock && x.short>0?'<span class="s" style="color:var(--danger)">thiếu '+x.short+'</span>':'')+'</td></tr>').join("")
        + '</table></div>'
        + (shortList.length ? '<button class="btn soft sm" id="allShort" style="margin-top:10px">Đưa '+shortList.length+' mặt hàng thiếu vào Cần mua</button>' : "")
        + '</div>' : "")

    + '<div class="sec"><div class="sec-h"><h2>Đơn cần soạn — gom theo ngày giao</h2><span class="spacer"></span><span class="count">'+list.length+'</span></div>'
    + (list.length ? groupByDate(list) : '<div class="empty"><strong>Không còn đơn nào cần soạn</strong>Đơn mới nhân viên nhập vào sẽ hiện ở đây.</div>')
    + '</div>';

  $("#openManifest").onclick = ()=> manifestDialog();
  $("#v-prep").querySelectorAll("[data-p]").forEach(b=> b.onclick=()=>{ PF=b.dataset.p; viewPrep(); });
  $("#v-prep").querySelectorAll(".order").forEach(c=> c.onclick=()=> prepDialog(c.dataset.id));
  const as = $("#allShort");
  if(as) as.onclick = ()=>{
    shortList.forEach(x=> addToBuy(x.sku, x.name, x.short, x.unit, "Thiếu cho đơn đang soạn"));
    save(); viewPrep(); renderTabs(); toast("Đã thêm vào Cần mua");
  };
}

/* ---- PHIẾU XUẤT HÀNG: gom nhiều ngày thành một chuyến ---- */
let MF = {from:"", to:"", brand:"all"};
/* lấy mã bưu chính 6 số trong địa chỉ */
function postcodeOf(a){
  const m = String(a||"").match(/(?:^|[^\d])(\d{6})(?![\d])/);
  return m ? m[1] : "";
}
/* một dòng khách cho danh sách soạn đơn:
   Tên · SĐT · Postcode · Món × SL · Tổng                                  */
function pickRows(list){
  return (list||[]).map(o=>({
    o, name: o.customer || "Khách lẻ", phone: o.phone || "",
    post: postcodeOf(o.address), code: orderCode(o),
    items: (o.items||[]).map(i=>({name:i.name, qty:i.qty, unit:i.unit||""})),
    total: orderNet(o), paid: o.pay === "da", prep: o.prep || "chua"
  }));
}
function manifestData(){
  const from = MF.from, to = MF.to;
  const list = DB.orders.filter(o=> o.status!=="huy" && o.date >= from && o.date <= to
      && (MF.brand==="all" || o.brand===MF.brand))
    .sort((a,b)=> (a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")));
  const byItem = {};
  /* gộp theo TÊN món, không theo mã — cùng "Phí giao hàng" ở nhiều đơn
     phải cộng lại thành một dòng, không tách ra nhiều dòng trùng tên. */
  list.forEach(o=> orderParts(o).forEach(p=>{
    const k = norm(p.name) + "|" + (p.unit || "");
    byItem[k] = byItem[k] || {name:p.name, unit:p.unit, qty:0, kg:0};
    byItem[k].qty = +(byItem[k].qty + p.qty).toFixed(2);
    byItem[k].kg  = +(byItem[k].kg + p.qty*(p.kg||0)).toFixed(2);
  }));
  const items = Object.keys(byItem).map(k=>byItem[k]).sort((a,b)=> b.kg - a.kg || a.name.localeCompare(b.name,"vi"));
  return {
    list, items,
    kg: +list.reduce((s,o)=> s + orderKg(o), 0).toFixed(2),
    money: +list.reduce((s,o)=> s + orderNet(o), 0).toFixed(2),
    unpaid: +list.filter(o=>o.pay!=="da").reduce((s,o)=> s + orderNet(o) - (o.deposit||0), 0).toFixed(2)
  };
}
function manifestText(){
  const d = manifestData();
  const L = ["📋 DANH SÁCH SOẠN ĐƠN", viDateFull(MF.from) + " → " + viDateFull(MF.to) + (MF.brand==="all"?"":" · "+MF.brand), "——————————"];
  L.push("Tổng: " + d.list.length + " đơn · " + kgTxt(d.kg) + " · " + money(d.money));
  L.push("");
  L.push("HÀNG CẦN XUẤT");
  d.items.forEach(i=> L.push("• " + i.name + " — " + i.qty + " " + i.unit + (i.kg ? " (" + kgTxt(i.kg) + ")" : "")));
  L.push("");
  L.push("SOẠN ĐƠN THEO KHÁCH");
  pickRows(d.list).forEach((r,n)=>{
    L.push("");
    L.push((n+1) + ". " + r.name + " — " + (r.phone||"—") + " — " + (r.post||"—") + " — " + r.code);
    r.items.forEach(i=> L.push("   • " + i.name + " × " + i.qty + (i.unit ? " " + i.unit : "")));
    L.push("   Tổng: " + money(r.total) + (r.paid ? " ✓ đã thu" : " ⚠ chưa thu"));
  });
  return L.join("\n");
}

/* gom danh sách đơn thành từng nhóm theo ngày giao */
function groupByDate(list){
  const days = [];
  list.forEach(o=>{
    let g = days.find(x=>x.date===o.date);
    if(!g){ g = {date:o.date, orders:[]}; days.push(g); }
    g.orders.push(o);
  });
  days.sort((a,b)=> a.date.localeCompare(b.date));
  return days.map(g=>{
    const kg = +g.orders.reduce((s,o)=> s + orderKg(o), 0).toFixed(2);
    const left = g.orders.filter(o=> (o.prep||"chua")!=="du").length;
    return '<div class="daygroup">'
      + '<div class="dayhead"><b>' + viDateFull(g.date) + '</b>'
      + '<span>' + viDate(g.date) + ' · ' + g.orders.length + ' đơn'
      + (left ? ' · còn ' + left + ' chưa soạn' : ' · đã soạn hết')
      + (kg ? ' · ' + kgTxt(kg) : "") + '</span></div>'
      + '<div class="rowlist">' + g.orders.map(o=>orderCard(o,"kho")).join("") + '</div>'
      + '</div>';
  }).join("");
}

function addToBuy(sku, name, qty, unit, note){
  const exist = DB.buy.find(b=> b.sku===sku && b.status!=="ve");
  if(exist){ exist.qty = qty+" "+unit; exist.note = note; pushOutbox("buy", exist); return; }
  const rec = {id:uid(), sku:sku||null, name, qty:qty+" "+unit, note:note||"", status:"can"};
  DB.buy.push(rec); pushOutbox("buy", rec);
}

function prepDialog(id){
  const o = DB.orders.find(x=>x.id===id); if(!o) return;
  o.picked = o.picked || {};
  const missing = {};
  const lines = orderParts(o);
  const rows = lines.map(i=>{
    const it = DB.items.find(x=>x.sku===i.sku);
    const have = it ? it.qty : 0;
    const nostock = !it || it.group==="Dịch vụ" || (it.min===0 && it.qty===0);
    const low = !nostock && have < i.qty;
    return '<div class="check'+(o.picked[i.sku]?" on":"")+'" data-sku="'+i.sku+'">'
      + '<span class="box">'+(o.picked[i.sku]?"✓":"")+'</span>'
      + '<span class="t"><b>'+esc(i.name)+'</b><span>'+(i.note?'<b style="color:var(--warn)">'+esc(i.note)+'</b> · ':'')+(i.from?'trong '+esc(i.from)+' · ':'')+(nostock?'làm theo đơn':'kho còn '+have+' '+esc(i.unit)+(low?' — không đủ':''))+'</span></span>'
      + '<span class="q mono">'+i.qty+'<span style="font-size:11px;color:var(--ink-3)"> '+esc(i.unit)+'</span></span>'
      + '<button type="button" class="miss" data-miss="'+i.sku+'">Thiếu</button>'
      + '</div>';
  }).join("");

  openDialog("Soạn đơn "+orderCode(o), `
    <div class="note" style="margin-bottom:14px"><b>${esc(o.customer||"Khách lẻ")}</b> · ${esc(o.brand)} · giao ${viDate(o.date)}${o.time?" lúc "+o.time:""}${orderKg(o)?" · <b>"+kgTxt(orderKg(o))+"</b>":""}</div>
    <div class="note" style="margin-bottom:14px;${o.pay==="da"?"border-color:var(--accent);background:var(--accent-soft)":o.pay==="coc"?"border-color:var(--warn);background:var(--warn-soft)":"border-color:var(--danger);background:var(--danger-soft)"}">
      💵 <b>${PAY[o.pay]}</b>${o.pay==="coc" && o.deposit ? " "+money(o.deposit)+" · còn "+money(orderNet(o)-o.deposit) : o.pay==="chua" ? " · thu "+money(orderNet(o)) : ""}
    </div>
    ${o.address ? '<div class="note" style="margin-bottom:14px">📍 '+esc(o.address)+'</div>' : ""}
    ${o.note ? '<div class="note" style="margin-bottom:14px">📝 '+esc(o.note)+'</div>' : ""}
    <div class="sec-h"><h2>Bấm vào từng món khi đã soạn</h2></div>
    <div class="rowlist" id="checks">${rows || '<div class="empty" style="padding:18px">Đơn này chưa có món nào.</div>'}</div>
    <div class="field" style="margin-top:16px"><label>Ghi chú cho nhân viên giao</label><input id="p_note" value="${esc(o.prepNote||"")}" placeholder="Vd: thiếu 1kg xoài, đã báo chị"></div>
    <button type="button" class="btn soft sm" id="p_allbuy">🛒 Đưa cả đơn này vào Cần mua</button>
  `, [
    {label:"Đóng", cls:"ghost", fn:null},
    {label:"Lưu", cls:"", fn:()=>{
      const total = lines.length;
      const done = lines.filter(i=>o.picked[i.sku]).length;
      const anyMiss = Object.keys(missing).some(k=>missing[k]);
      o.prepNote = document.getElementById("p_note").value.trim();
      o.prep = anyMiss ? "thieu" : (total && done===total) ? "du" : done ? "dang" : "chua";
      if(o.prep==="du" && o.status==="moi") o.status = "lam";
      Object.keys(missing).forEach(sku=>{
        if(!missing[sku]) return;
        const i = lines.find(x=>x.sku===sku); if(!i) return;
        const it = DB.items.find(x=>x.sku===sku);
        const gap = +(i.qty - (it ? it.qty : 0)).toFixed(2);
        addToBuy(sku, i.name, gap > 0 ? gap : i.qty, i.unit, "Thiếu cho đơn "+orderCode(o));
      });
      mergeUp(DB.orders, o, "id"); pushOutbox("order", o); save(); renderAll();
      toast(o.prep==="du" ? "Đơn đã soạn đủ" : o.prep==="thieu" ? "Đã ghi thiếu hàng + thêm vào Cần mua" : "Đã lưu");
    }}
  ]);

  const ab = document.getElementById("p_allbuy");
  if(ab) ab.onclick = ()=>{
    lines.forEach(i=> addToBuy(i.sku, i.name, i.qty, i.unit, "Cho đơn " + orderCode(o) + " · giao " + viDateFull(o.date)));
    save(); renderAll();
    toast("Đã đưa " + lines.length + " món vào Cần mua");
  };
  document.querySelectorAll("#checks .check").forEach(el=>{
    el.onclick = e=>{
      if(e.target.closest("[data-miss]")) return;
      const sku = el.dataset.sku;
      o.picked[sku] = !o.picked[sku];
      el.classList.toggle("on", !!o.picked[sku]);
      el.querySelector(".box").textContent = o.picked[sku] ? "✓" : "";
    };
  });
  document.querySelectorAll("#checks [data-miss]").forEach(b=>{
    b.onclick = ()=>{
      const sku = b.dataset.miss;
      missing[sku] = !missing[sku];
      b.classList.toggle("on", !!missing[sku]);
      b.closest(".check").classList.toggle("short", !!missing[sku]);
    };
  });
}

/* ============== 7. KHO ============== */
function lowStock(){ return DB.items.filter(i=> !isCombo(i) && i.min>0 && i.qty <= i.min); }
/* đơn đã qua ngày giao mà vẫn chưa thu đủ */
function overdue(){
  const t = todayStr();
  return DB.orders.filter(o=> o.status!=="huy" && o.pay!=="da" && o.date < t)
    .sort((a,b)=> a.date.localeCompare(b.date));
}
function daysLate(o){
  const a = new Date(o.date + "T00:00:00"), b = new Date(todayStr() + "T00:00:00");
  return Math.round((b - a) / 86400000);
}

let SG = "all";
function viewStock(){
  const groups = ["all"].concat(allGroups().filter(g=> DB.items.some(i=>i.group===g)));
  let items = DB.items.slice();
  if(SG!=="all") items = items.filter(i=>i.group===SG);
  items.sort((a,b)=> (a.qty<=a.min?0:1) - (b.qty<=b.min?0:1) || a.name.localeCompare(b.name,"vi"));

  const low = lowStock();
  $("#v-stock").innerHTML =
    (low.length ? '<div class="note" style="margin-bottom:12px;border-color:var(--warn);background:var(--warn-soft)"><b>'+low.length+' mặt hàng sắp hết.</b> '+(ROLE==="staff"?"Báo kho để đặt thêm.":"Xem tab <b>Cần mua</b> để đặt.")+'</div>' : "")
    + '<div class="filters">'+groups.map(g=>'<button class="fchip'+(SG===g?" on":"")+'" data-g="'+esc(g)+'">'+(g==="all"?"Tất cả":esc(g))+'</button>').join("")+'</div>'
    + '<div class="rowlist">'+ items.map(i=>{
        const combo = isCombo(i);
        const sub = combo
          ? 'Combo · '+money(i.price)+' · '+i.parts.length+' món · '+kgTxt(itemKg(i))
          : esc(i.group)+(i.brand?' · <b>'+esc(i.brand)+'</b>':"")+' · '+money(i.price)+'/'+i.unit + (i.kg?' · '+i.kg+' kg/'+i.unit:"")
            + (ROLE==="owner"?' · vốn '+money(i.cost):"") + (i.min>0?' · tối thiểu '+i.min:"");
        return '<div class="inv'+(!combo && i.min>0 && i.qty<=i.min?" low":"")+'">'
        + '<div class="nm" data-edit="'+i.sku+'" style="cursor:pointer"><b>'+esc(i.name)+'</b><span>'+sub+'</span></div>'
        + (combo
            ? '<button class="btn soft sm" data-edit="'+i.sku+'">Sửa</button>'
            : '<div class="qty mono">'+i.qty+'<em> '+i.unit+'</em></div>'
              + '<div class="stepper"><button data-m="-" data-s="'+i.sku+'">−</button><button data-m="+" data-s="'+i.sku+'">+</button></div>')
        + '</div>';
      }).join("") + '</div>'
    + '<div class="btnrow" style="margin-top:14px"><button class="btn ghost sm" id="addItem" style="flex:1">+ Thêm mặt hàng</button>'
    + (ROLE==="owner" ? '<button class="btn ghost sm" id="addCombo" style="flex:1">+ Combo mới</button>' : "")+'</div>'
    + '<div class="note" style="margin-top:12px">Bấm − / + để cập nhật số lượng thực tế sau khi kiểm kho. Chạm vào tên mặt hàng để sửa giá, số ký, mức tối thiểu.</div>';

  $("#v-stock").querySelectorAll("[data-g]").forEach(b=> b.onclick=()=>{ SG=b.dataset.g; viewStock(); });
  $("#v-stock").querySelectorAll("[data-edit]").forEach(b=> b.onclick=()=>{
    const it = DB.items.find(x=>x.sku===b.dataset.edit);
    if(isCombo(it)) comboForm(it.sku); else itemForm(it.sku);
  });
  const ac = $("#addCombo"); if(ac) ac.onclick = ()=> comboForm(null);
  $("#v-stock").querySelectorAll("[data-m]").forEach(b=> b.onclick=()=>{
    const it = DB.items.find(x=>x.sku===b.dataset.s);
    it.qty = Math.max(0, +(it.qty + (b.dataset.m==="+"?1:-1)).toFixed(2));
    pushOutbox("item", it); save(); viewStock(); renderTabs();
  });
  const ai = $("#addItem"); if(ai) ai.onclick = ()=> itemForm(null);
}

function itemForm(sku){
  const ex = sku ? DB.items.find(x=>x.sku===sku) : null;
  const d = ex || {sku:"", name:"", group:GROUPS[1], unit:"cái", qty:0, min:0, cost:0, price:0, kg:0};
  openDialog(ex ? "Sửa mặt hàng" : "Thêm mặt hàng", `

/* ---- COMBO: một mặt hàng gồm nhiều món con, có giá riêng ---- */
function comboForm(sku){
  const ex = sku ? DB.items.find(x=>x.sku===sku) : null;
  const d = ex || {sku:"", name:"", group:"Combo", unit:"combo", qty:0, min:0, cost:0, price:0, kg:0, parts:[]};
  let parts = {}; (d.parts||[]).forEach(p=> parts[p.sku] = p.qty);

  function partRows(){
    return allGroups().filter(g=>g!=="Combo").map(g=>{
      const its = DB.items.filter(i=> i.group===g && !isCombo(i));
      if(!its.length) return "";
      return '<div class="gtitle">'+g+'</div>' + its.map(i=>
        '<div class="pick'+(parts[i.sku]?" on":"")+'" data-row="'+i.sku+'"><div class="n">'+esc(i.name)
        + '<em>'+money(i.price)+' / '+i.unit+(i.kg?' · '+i.kg+' kg':'')+'</em></div>'
        + '<input type="number" min="0" step="0.5" data-p="'+i.sku+'" value="'+(parts[i.sku]||"")+'" placeholder="0"></div>').join("");
    }).join("");
  }
  function sums(){
    let kg = 0, cost = 0, listPrice = 0;
    Object.keys(parts).forEach(s=>{
      const n = parts[s]; if(!(n>0)) return;
      const it = DB.items.find(x=>x.sku===s); if(!it) return;
      kg += n*(it.kg||0); cost += n*(it.cost||0); listPrice += n*(it.price||0);
    });
    return {kg:+kg.toFixed(2), cost:+cost.toFixed(2), listPrice:+listPrice.toFixed(2)};
  }
  function refresh(){
    const s = sums();
    const price = parseFloat((document.getElementById("c_price")||{}).value) || 0;
    const box = document.getElementById("c_sum");
    if(box) box.innerHTML =
      '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)"><span>Mua lẻ từng món</span><span class="mono">'+money(s.listPrice)+'</span></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)"><span>Cân nặng combo</span><span class="mono">'+kgTxt(s.kg)+'</span></div>'
      + (ROLE==="owner" ? '<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)"><span>Giá vốn combo</span><span class="mono">'+money(s.cost)+'</span></div>' : "")
      + (price ? '<div style="display:flex;justify-content:space-between;font-weight:700;margin-top:6px"><span>Khách tiết kiệm</span><span class="mono" style="color:var(--accent)">'+money(Math.max(0, s.listPrice-price))+'</span></div>' : "");
  }

  openDialog(ex ? "Sửa combo" : "Combo mới", `
    <div class="field"><label>Tên combo</label><input id="c_name" value="${esc(d.name)}" placeholder="Vd: Combo cuối tuần 4 người"></div>
    <div class="field"><label>Giá bán combo</label><input type="number" step="0.01" id="c_price" value="${d.price||""}" placeholder="0.00"></div>
    <div class="card" style="padding:12px;margin-bottom:14px" id="c_sum"></div>
    <div class="sec-h"><h2>Combo gồm những gì</h2></div>
    <div id="cpicker">${partRows()}</div>
    <div class="note" style="margin-top:12px">Cân nặng và giá vốn của combo app tự cộng từ các món con. Khi kho soạn đơn, combo mở ra thành từng món con và trừ kho theo món con.</div>
  `, [
    {label: ex && ROLE==="owner" ? "Xoá" : "Huỷ", cls: ex && ROLE==="owner" ? "danger" : "ghost", fn: ex && ROLE==="owner" ? ()=>{
      if(!confirm("Xoá combo “"+ex.name+"”?")) return false;
      DB.items = DB.items.filter(x=>x.sku!==ex.sku); save(); renderAll();
    } : null},
    {label: ex ? "Lưu" : "Tạo combo", cls:"", fn:()=>{
      const name = document.getElementById("c_name").value.trim();
      if(!name){ toast("Nhập tên combo"); return false; }
      const list = Object.keys(parts).filter(s=>parts[s]>0).map(s=>({sku:s, qty:parts[s]}));
      if(!list.length){ toast("Chọn ít nhất một món cho combo"); return false; }
      const rec = Object.assign({}, d, {
        sku: d.sku || ("CB"+uid().slice(-4).toUpperCase()), name, group:"Combo", unit:"combo",
        qty:0, min:0, kg:0, cost:0,
        price: parseFloat(document.getElementById("c_price").value)||0,
        parts: list});
      mergeUp(DB.items, rec, "sku"); pushOutbox("item", rec); save(); renderAll();
    }}
  ]);

  function wire(){
    document.querySelectorAll("#cpicker .pick").forEach(el=>{
      el.onclick = e=>{
        if(e.target.tagName === "INPUT") return;
        const s = el.dataset.row;
        parts[s] = +((parts[s]||0) + 1).toFixed(2);
        document.getElementById("cpicker").innerHTML = partRows(); wire(); refresh();
      };
    });
    document.querySelectorAll("#cpicker input[data-p]").forEach(inp=>{
      inp.oninput = ()=>{
        const v = parseFloat(inp.value);
        if(v>0) parts[inp.dataset.p] = v; else delete parts[inp.dataset.p];
        refresh();
      };
      inp.onblur = ()=>{ document.getElementById("cpicker").innerHTML = partRows(); wire(); refresh(); };
    });
  }
  wire(); refresh();
  const cp = document.getElementById("c_price"); if(cp) cp.oninput = refresh;
}

/* ============== 9. DOANH THU (CHỈ CHỦ) ============== */
let MONTH = todayStr().slice(0,7);
function viewMoney(){
  if(ROLE!=="owner"){ $("#v-money").innerHTML = '<div class="empty">Mục này chỉ chủ xem được.</div>'; return; }
  const inM = DB.orders.filter(o=> o.date.startsWith(MONTH) && o.status!=="huy");
  const rev = inM.reduce((s,o)=>s+orderNet(o),0);
  const cost = inM.reduce((s,o)=>s+orderCost(o),0);
  const collected = inM.reduce((s,o)=> s + (o.pay==="da"?orderNet(o):(o.deposit||0)), 0);
  const debt = rev - collected;
  const avg = inM.length ? rev/inM.length : 0;
  const disc = +inM.reduce((s,o)=> s + orderDisc(o), 0).toFixed(2);
  const kgSum = +inM.reduce((s,o)=> s + orderKg(o), 0).toFixed(2);

  const byBrand = BRANDS.map(b=>{
    const l = inM.filter(o=>o.brand===b);
    return {b, n:l.length, rev:l.reduce((s,o)=>s+orderNet(o),0), profit:l.reduce((s,o)=>s+orderNet(o)-orderCost(o),0)};
  }).filter(x=>x.n>0);

  /* sổ nhân viên tính cả bill huỷ để cuối tháng đếm đủ */
  const ag = {};
  DB.orders.filter(o=> o.date.startsWith(MONTH)).forEach(o=>{
    const k = o.agent || "Không ghi mã";
    ag[k] = ag[k] || {n:0, rev:0, profit:0, kg:0, owe:0, late:0, huy:0};
    if(o.status === "huy"){ ag[k].huy++; return; }
    ag[k].n++; ag[k].rev += orderNet(o); ag[k].profit += orderNet(o) - orderCost(o); ag[k].kg += orderKg(o);
    if(o.pay !== "da") ag[k].owe += orderNet(o) - (o.deposit||0);
    if(o.pay !== "da" && o.date < todayStr()) ag[k].late++;
  });
  const byAgent = Object.keys(ag).map(a=>({a, ...ag[a]})).sort((x,y)=> y.rev - x.rev);

  const cust = {};
  inM.forEach(o=>{ const k=o.customer||"Khách lẻ"; cust[k]=cust[k]||{n:0,rev:0}; cust[k].n++; cust[k].rev+=orderNet(o); });
  const top = Object.keys(cust).map(k=>({k, ...cust[k]})).sort((a,b)=>b.rev-a.rev).slice(0,8);

  const unpaid = DB.orders.filter(o=> o.pay!=="da" && o.status!=="huy")
    .sort((a,b)=>a.date.localeCompare(b.date));
  const unpaidSum = unpaid.reduce((s,o)=>s+orderNet(o)-(o.deposit||0),0);

  const days = new Date(+MONTH.slice(0,4), +MONTH.slice(5,7), 0).getDate();
  const daily = Array.from({length:days},(_,i)=>{
    const ds = MONTH+"-"+pad(i+1);
    return inM.filter(o=>o.date===ds).reduce((s,o)=>s+orderNet(o),0);
  });
  const peak = Math.max(1, ...daily);

  const months = [];
  for(let i=0;i<12;i++){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(todayStr(d).slice(0,7)); }

  $("#v-money").innerHTML =
    '<div class="field"><label>Xem tháng</label><select id="m_pick">'+months.map(m=>'<option value="'+m+'"'+(m===MONTH?" selected":"")+'>Tháng '+(+m.slice(5,7))+'/'+m.slice(0,4)+'</option>').join("")+'</select></div>'
    + '<div class="statgrid" style="margin-bottom:16px">'
    + '<div class="stat hero wide"><div class="k">Doanh thu tháng</div><div class="v mono">'+money(rev)+'</div><div class="sub">'+inM.length+' đơn · trung bình '+money(avg)+'/đơn</div></div>'
    + '<div class="stat"><div class="k">Giá vốn</div><div class="v mono">'+money(cost)+'</div></div>'
    + '<div class="stat"><div class="k">Lãi gộp</div><div class="v mono" style="color:var(--accent)">'+money(rev-cost)+'</div><div class="sub">'+(rev? Math.round((rev-cost)/rev*100):0)+'% doanh thu</div></div>'
    + '<div class="stat"><div class="k">Đã thu</div><div class="v mono">'+money(collected)+'</div></div>'
    + '<div class="stat'+(debt>0?" alert":"")+'"><div class="k">Còn nợ tháng này</div><div class="v mono">'+money(debt)+'</div></div>'
    + '<div class="stat wide"><div class="k">Đã giảm giá</div><div class="v mono">'+money(disc)+'</div><div class="sub">'
      + inM.filter(o=>orderDisc(o)>0).length+' đơn có giảm · tổng ký đã giao '+kgTxt(kgSum)+'</div></div>'
    + '</div>'

    + '<div class="sec"><div class="sec-h"><h2>Doanh thu từng ngày</h2></div><div class="card">'
    + '<div class="bars">'+daily.map(v=>'<div class="b" title="'+money(v)+'"><i style="height:'+Math.round(v/peak*100)+'%"></i></div>').join("")+'</div>'
    + '<div class="barlabels"><span>01</span><span>'+pad(Math.round(days/2))+'</span><span>'+days+'</span></div></div></div>'

    + (byBrand.length ? '<div class="sec"><div class="sec-h"><h2>Theo thương hiệu</h2></div><div class="card"><table class="tbl">'
      + byBrand.map(x=>'<tr><td>'+esc(x.b)+'<span class="s">'+x.n+' đơn · lãi '+money(x.profit)+'</span></td><td class="mono">'+money(x.rev)+'</td></tr>').join("")
      + '</table></div></div>' : "")

    + '<div class="sec"><div class="sec-h"><h2>Khách còn nợ</h2><span class="spacer"></span><span class="count mono" style="color:var(--danger)">'+money(unpaidSum)+'</span></div>'
    + (unpaid.length ? '<div class="card"><table class="tbl">'+unpaid.map(o=>
        '<tr><td>'+esc(o.customer||"Khách lẻ")+'<span class="s">'+viDate(o.date)+' · '+orderCode(o)+' · '+PAY[o.pay]+'</span></td>'
        + '<td class="mono" style="color:var(--danger)">'+money(orderNet(o)-(o.deposit||0))+'</td></tr>').join("")+'</table></div>'
      : '<div class="empty" style="padding:22px">Không ai còn nợ. 👏</div>')
    + '</div>'

    + (byAgent.length ? '<div class="sec"><div class="sec-h"><h2>Sổ từng nhân viên — tháng này</h2></div>'
      + '<div class="rowlist">' + byAgent.map(x=>
          '<div class="inv" data-ag2="'+esc(x.a)+'" style="cursor:pointer">'
          + '<span class="agent" style="font-size:12px;padding:5px 9px">'+esc(x.a)+'</span>'
          + '<div class="nm"><b>'+x.n+' bill · '+money(x.rev)+'</b><span>lãi '+money(x.profit)+' · '+kgTxt(x.kg)
          + (x.huy ? ' · '+x.huy+' bill huỷ' : "")
          + (x.owe>0 ? ' · <b style="color:var(--danger)">còn nợ '+money(x.owe)+'</b>' : ' · đã thu đủ')
          + (x.late ? ' · <b style="color:var(--danger)">'+x.late+' bill quá hạn</b>' : "")+'</span></div>'
          + '<span style="color:var(--ink-3)">›</span></div>').join("")
      + '</div></div>' : "")

    + (top.length ? '<div class="sec"><div class="sec-h"><h2>Khách mua nhiều nhất</h2></div><div class="card"><table class="tbl">'
      + top.map(x=>'<tr><td>'+esc(x.k)+'<span class="s">'+x.n+' đơn</span></td><td class="mono">'+money(x.rev)+'</td></tr>').join("")
      + '</table></div></div>' : "");

  $("#m_pick").onchange = e=>{ MONTH = e.target.value; viewMoney(); };
  $("#v-money").querySelectorAll("[data-ag2]").forEach(el=> el.onclick = ()=> agentSheet(el.dataset.ag2));
}

/* bill xong hẳn = đã giao + đã thu đủ */
function doneState(o){
  if(o.status === "huy") return {t:"🚫 Đã huỷ", c:"var(--danger)"};
  if(o.status === "xong" && o.pay === "da") return {t:"✅ Hoàn tất", c:"var(--accent)"};
  if(o.status === "xong") return {t:"🚚 Đã giao, chưa thu đủ", c:"var(--danger)"};
  if(o.pay === "da") return {t:"💵 Đã thu, chưa giao", c:"var(--warn)"};
  return {t:"⏳ Chưa xong", c:"var(--ink-3)"};
}
function itemsShort(o){
  const s = (o.items||[]).map(i=> i.qty + "× " + i.name).join(", ");
  return s.length > 60 ? s.slice(0,58) + "…" : s;
}

/* ---- SỔ RIÊNG CỦA TỪNG MÃ NHÂN VIÊN ---- */
function agentSheet(code, month){
  const M = month || MONTH;
  const inM = DB.orders.filter(o=> o.date.startsWith(M) && (o.agent || "Không ghi mã") === code)
    .sort((a,b)=> a.date.localeCompare(b.date));
  const live = inM.filter(o=> o.status !== "huy");
  const cancelled = inM.filter(o=> o.status === "huy");
  const rev = +live.reduce((s,o)=> s + orderNet(o), 0).toFixed(2);
  const got = +live.reduce((s,o)=> s + (o.pay==="da" ? orderNet(o) : (o.deposit||0)), 0).toFixed(2);
  const owe = +(rev - got).toFixed(2);
  const late = live.filter(o=> o.pay!=="da" && o.date < todayStr());
  const refund = +live.reduce((s,o)=> s + orderRefund(o), 0).toFixed(2);

  openDialog("Sổ bill " + code + " — tháng " + (+M.slice(5,7)) + "/" + M.slice(0,4), `
    <div class="statgrid" style="margin-bottom:14px">
      <div class="stat hero wide"><div class="k">Doanh thu</div><div class="v mono">${money(rev)}</div>
        <div class="sub">${live.length} bill${cancelled.length?" · "+cancelled.length+" bill huỷ":""}</div></div>
      <div class="stat"><div class="k">Đã thu</div><div class="v mono">${money(got)}</div></div>
      <div class="stat${owe>0?" alert":""}"><div class="k">Còn nợ</div><div class="v mono">${money(owe)}</div></div>
      ${late.length ? '<div class="stat alert wide"><div class="k">Bill quá hạn chưa thu</div><div class="v mono">'+late.length+'</div><div class="sub">'+late.map(o=>orderCode(o)+" trễ "+daysLate(o)+" ngày").join(" · ")+'</div></div>' : ""}
      ${refund>0 ? '<div class="stat wide"><div class="k">Hàng hư / trả lại</div><div class="v mono">'+money(refund)+'</div></div>' : ""}
    </div>
    <div class="sec-h"><h2>Danh sách bill</h2><span class="spacer"></span><span class="count">${inM.length}</span></div>
    ${inM.length ? '<div class="card"><table class="tbl">' + inM.map(o=>{
        const st = doneState(o);
        return '<tr><td><b>' + esc(orderCode(o)) + '</b> · ' + esc(o.customer||"Khách lẻ")
        + '<span class="s">' + viDateFull(o.date) + ' · ' + esc(itemsShort(o) || "—") + '</span>'
        + '<span class="s" style="color:' + st.c + '"><b>' + st.t + '</b>'
        + (o.status!=="huy" && o.pay!=="da" && o.date<todayStr() ? ' · trễ '+daysLate(o)+' ngày' : "")
        + (o.status==="huy" && o.cancelNote ? ' — '+esc(o.cancelNote) : "") + '</span>'
        + '</td><td class="mono"' + (o.status==="huy"?' style="text-decoration:line-through;color:var(--ink-3)"':'') + '>' + money(orderNet(o))
        + (o.vnd ? '<span class="s">'+vnd(vndFromSgd(orderNet(o)))+'</span>' : "") + '</td></tr>';
      }).join("")
      + '</table></div>' : '<div class="empty" style="padding:24px">Tháng này chưa có bill nào.</div>'}
  `, [
    {label:"Đóng", cls:"ghost", fn:null},
    {label:"Chép sổ", cls:"", fn:()=>{
      const L = ["SỔ BILL " + code + " — tháng " + (+M.slice(5,7)) + "/" + M.slice(0,4), "——————————",
        "Tổng: " + live.length + " bill · " + money(rev),
        "Đã thu: " + money(got), "Còn nợ: " + money(owe), ""];
      inM.forEach(o=> L.push(orderCode(o) + " · " + viDateFull(o.date) + " · " + (o.customer||"Khách lẻ")
        + "\n   " + (itemsShort(o) || "—") + "\n   " + money(orderNet(o)) + " · " + doneState(o).t));
      if(navigator.clipboard) navigator.clipboard.writeText(L.join("\n")).then(()=>toast("Đã chép sổ "+code));
      return false;
    }}
  ]);
}

  function pickImage(input, maxSide, done){
    input.onchange = ()=>{
      const f = input.files && input.files[0]; if(!f) return;
      if(f.size > 10 * 1024 * 1024){ toast("Ảnh lớn quá, chọn ảnh nhỏ hơn"); return; }
      const rd = new FileReader();
      rd.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
          const cv = document.createElement("canvas");
          cv.width = Math.max(1, Math.round(img.width * sc));
          cv.height = Math.max(1, Math.round(img.height * sc));
          const cx = cv.getContext("2d");
          cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          done(cv.toDataURL("image/png"));
        };
        img.onerror = ()=> toast("Không đọc được ảnh này");
        img.src = rd.result;
      };
      rd.onerror = ()=> toast("Không đọc được file");
      rd.readAsDataURL(f);
    };
  }

      document.getElementById("rs_go").onclick = ()=>{

function promoForm(id){

    <div class="field"><label>Tên chương trình</label><input id="pm_name" value="${esc(d.name)}" placeholder="Vd: Đơn từ S$150 giảm 8%"></div>
    <div class="two">
      <div class="field"><label>Kiểu giảm</label><select id="pm_kind">
        <option value="percent"${d.kind==="percent"?" selected":""}>Giảm theo %</option>
        <option value="fixed"${d.kind==="fixed"?" selected":""}>Giảm số tiền</option>
      </select></div>
      <div class="field"><label>Mức giảm</label><input type="number" step="0.01" min="0" id="pm_value" value="${d.value}"></div>
    </div>
    <div class="sec-h" style="margin-top:6px"><h2>Điều kiện áp dụng</h2></div>
    <div class="two">
      <div class="field"><label>Đơn từ (S$)</label><input type="number" step="0.01" min="0" id="pm_total" value="${d.minTotal||0}"></div>
      <div class="field"><label>Từ (kg)</label><input type="number" step="0.1" min="0" id="pm_kg" value="${d.minKg||0}"></div>
    </div>
    <div class="field"><label>Chỉ áp dụng cho</label><select id="pm_brand">
      <option value="all"${d.brand==="all"?" selected":""}>Tất cả thương hiệu</option>
      ${BRANDS.map(b=>'<option'+(d.brand===b?" selected":"")+'>'+b+'</option>').join("")}
    </select></div>
    <div class="note">Để 0 nghĩa là không đặt điều kiện đó. Ví dụ "Đơn từ 100, từ 0 kg" = chỉ cần đơn đủ S$100.</div>
  `, [
    {label: ex ? "Xoá" : "Huỷ", cls: ex ? "danger" : "ghost", fn: ex ? ()=>{
      if(!confirm("Xoá khuyến mãi này?")) return false;
      DB.promos = DB.promos.filter(x=>x.id!==ex.id); save(); viewSet();

    {label: ex ? "Lưu" : "Thêm", cls:"", fn:()=>{
      const name = $("#pm_name").value.trim(); if(!name){ toast("Nhập tên chương trình"); return false; }
      const v = parseFloat($("#pm_value").value)||0; if(v<=0){ toast("Mức giảm phải lớn hơn 0"); return false; }
      const rec = {id: d.id || ("P"+uid().slice(-4).toUpperCase()), name, kind:$("#pm_kind").value, value:v,
        minTotal:parseFloat($("#pm_total").value)||0, minKg:parseFloat($("#pm_kg").value)||0,
        brand:$("#pm_brand").value, active: d.active !== false};
      if(!DB.promos) DB.promos = [];
      mergeUp(DB.promos, rec, "id"); save(); viewSet();
    }}
  ]);
