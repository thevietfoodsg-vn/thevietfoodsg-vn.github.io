<title>3 Sisters Vận Hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FBFAF6; --surface:#FFFFFF; --surface-2:#F4F5F0; --sunken:#EFF1EA;
  --ink:#16241F; --ink-2:#4A5A52; --ink-3:#7C8B82;
  --line:#E1E5DC; --line-2:#CFD6CA;
  --accent:#0E7C5A; --accent-soft:#E2F1EA; --accent-ink:#0A5A41;
  --warn:#B26A12; --warn-soft:#FBEEDC;
  --danger:#B23A2E; --danger-soft:#FAE6E3;
  --info:#2C6E8F; --info-soft:#E2EEF4;
  --shadow:0 1px 2px rgba(22,36,31,.06), 0 6px 18px rgba(22,36,31,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412; --surface:#171F1B; --surface-2:#1D2723; --sunken:#131A17;
    --ink:#E7EDE8; --ink-2:#A7B5AC; --ink-3:#7A8981;
    --line:#26312B; --line-2:#36443C;
    --accent:#48C293; --accent-soft:#123227; --accent-ink:#7CDCB4;
    --warn:#E0A44A; --warn-soft:#332512;
    --danger:#E8776A; --danger-soft:#331B18;
    --info:#6FB4D6; --info-soft:#12262F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#171F1B; --surface-2:#1D2723; --sunken:#131A17;
  --ink:#E7EDE8; --ink-2:#A7B5AC; --ink-3:#7A8981;
  --line:#26312B; --line-2:#36443C;
  --accent:#48C293; --accent-soft:#123227; --accent-ink:#7CDCB4;
  --warn:#E0A44A; --warn-soft:#332512;
  --danger:#E8776A; --danger-soft:#331B18;
  --info:#6FB4D6; --info-soft:#12262F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- shell ---------- */
#app{max-width:760px; margin:0 auto; padding-bottom:86px; min-height:100vh}
.topbar{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:10px;
}
.brandmark{
  width:32px;height:32px;border-radius:9px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;
}
.topbar h1{font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em; flex:1; line-height:1.2}
.topbar h1 small{display:block; font-weight:500; font-size:11px; color:var(--ink-3); letter-spacing:.04em; text-transform:uppercase}
.chip-role{
  font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent-ink); border:1px solid transparent;
}
.chip-role.staff{background:var(--info-soft); color:var(--info)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--ink-2);font-size:12px}
.iconbtn:hover{background:var(--surface-2)}

main{padding:14px 16px 0}
.view{display:none}
.view.on{display:block}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--surface); border-top:1px solid var(--line);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar .inner{max-width:760px;margin:0 auto;display:flex;width:100%}
.tab{
  flex:1; background:none; border:0; cursor:pointer; padding:6px 2px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-3); font-size:10.5px; font-weight:600; border-radius:10px;
  position:relative;
}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute}
.tab .badge{
  position:absolute; transform:translate(14px,-4px);
  background:var(--danger); color:#fff; font-size:9px; font-weight:700;
  min-width:15px; height:15px; border-radius:999px; display:grid; place-items:center; padding:0 4px;
}

/* ---------- generic ---------- */
.sec{margin-bottom:20px}
.sec-h{display:flex; align-items:baseline; gap:8px; margin:0 0 9px}
.sec-h h2{font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:0}
.sec-h .count{font-size:12px; color:var(--ink-3)}
.sec-h .spacer{flex:1}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.rowlist{display:flex; flex-direction:column; gap:9px}

.btn{
  background:var(--accent); color:#fff; border:0; border-radius:10px;
  padding:11px 16px; font-weight:600; font-size:14px; cursor:pointer; width:100%;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line-2)}
.btn.soft{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft); color:var(--danger); border:1px solid transparent}
.btn.sm{padding:7px 11px; font-size:12.5px; width:auto; border-radius:8px}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}

.filters{display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{
  flex:none; background:var(--surface); border:1px solid var(--line);
  padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:500;
  cursor:pointer; color:var(--ink-2); white-space:nowrap;
}
.fchip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
.field label{font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3)}
.field input, .field select, .field textarea{
  background:var(--sunken); border:1px solid var(--line); border-radius:9px;
  padding:10px 11px; font-size:15px; width:100%;
}
.field textarea{min-height:76px; resize:vertical; font-size:14px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.three{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}

.empty{text-align:center; padding:36px 20px; color:var(--ink-3); font-size:13.5px}
.empty strong{display:block; color:var(--ink-2); font-size:15px; font-weight:600; margin-bottom:4px}

/* ---------- order card ---------- */
.order{
  position:relative; overflow:hidden; padding:12px 13px 12px 16px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
}
.order::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--line-2)}
.order[data-stripe="red"]::before{background:var(--danger)}
.order[data-stripe="amber"]::before{background:var(--warn)}
.order[data-stripe="green"]::before{background:var(--accent)}
.order[data-stripe="blue"]::before{background:var(--info)}
.order.done{opacity:.62}
.order .l1{display:flex; align-items:center; gap:8px; margin-bottom:3px}
.order .who{font-weight:600; font-size:15px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.order .amt{font-weight:600; font-size:14px}
.agent{flex:none; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:2px 6px; border-radius:5px;
  background:var(--ink); color:var(--bg)}
.order .l2{font-size:13px; color:var(--ink-2); margin-bottom:7px; display:flex; gap:6px; align-items:flex-start}
.order .l2 svg{width:14px;height:14px;flex:none;margin-top:3px;stroke:var(--ink-3);fill:none;stroke-width:1.6}
.order .l3{display:flex; gap:5px; flex-wrap:wrap; align-items:center}

.pill{font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; letter-spacing:.01em}
.p-moi{background:var(--info-soft); color:var(--info)}
.p-lam{background:var(--warn-soft); color:var(--warn)}
.p-giao{background:var(--accent-soft); color:var(--accent-ink)}
.p-xong{background:var(--surface-2); color:var(--ink-3)}
.p-huy{background:var(--danger-soft); color:var(--danger)}
.p-chua{background:var(--danger-soft); color:var(--danger)}
.p-pchua{background:var(--info-soft); color:var(--info)}
.p-pdang{background:var(--warn-soft); color:var(--warn)}
.p-pdu{background:var(--accent-soft); color:var(--accent-ink)}
.p-pthieu{background:var(--danger-soft); color:var(--danger)}
.check{display:flex; align-items:center; gap:11px; padding:11px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); cursor:pointer}
.check.on{background:var(--accent-soft); border-color:var(--accent)}
.check.short{background:var(--danger-soft); border-color:var(--danger)}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:14px;color:#fff}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check .t{flex:1;min-width:0}
.check .t b{display:block;font-weight:600;font-size:14.5px}
.check .t span{font-size:11.5px;color:var(--ink-3)}
.check .q{font-weight:700;font-size:16px}
.miss{background:none;border:1px solid var(--line-2);border-radius:8px;padding:5px 9px;font-size:11.5px;cursor:pointer;color:var(--ink-2);flex:none}
.miss.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.p-coc{background:var(--warn-soft); color:var(--warn)}
.p-da{background:var(--accent-soft); color:var(--accent-ink)}
.pill.brand{background:transparent; border:1px solid var(--line-2); color:var(--ink-3); font-weight:500}
.pill.time{background:transparent; color:var(--ink-3); font-weight:500; padding-left:0}

/* ---------- inventory ---------- */
.inv{display:flex; align-items:center; gap:11px; padding:11px 13px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r)}
.inv.low{border-color:var(--warn); background:var(--warn-soft)}
.inv .nm{flex:1; min-width:0}
.inv .nm b{display:block; font-weight:600; font-size:14.5px}
.inv .nm span{font-size:11.5px; color:var(--ink-3)}
.inv .qty{text-align:right; font-size:15px; font-weight:600; min-width:62px}
.inv .qty em{font-style:normal; font-size:11px; color:var(--ink-3); font-weight:500}
.stepper{display:flex; gap:0; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; flex:none}
.stepper button{width:32px; height:32px; background:var(--surface-2); border:0; cursor:pointer; font-size:16px; font-weight:600; color:var(--ink-2)}
.stepper button:active{background:var(--accent-soft)}
.stepper button+button{border-left:1px solid var(--line)}

/* ---------- money / stats ---------- */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px}
.stat.wide{grid-column:1/-1}
.stat .k{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); margin-bottom:5px}
.stat .v{font-size:23px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
.stat .sub{font-size:11.5px; color:var(--ink-3); margin-top:4px}
.stat.hero{background:var(--accent); border-color:var(--accent); color:#fff}
.stat.hero .k{color:rgba(255,255,255,.8)}
.stat.hero .sub{color:rgba(255,255,255,.85)}
.stat.alert{border-color:var(--danger)}
.stat.alert .v{color:var(--danger)}

.bars{display:flex; align-items:flex-end; gap:3px; height:86px; padding:10px 12px 0; overflow-x:auto}
.bars .b{flex:1; min-width:7px; height:100%; background:var(--sunken); border-radius:3px; position:relative}
.bars .b i{position:absolute; inset:auto 0 0 0; background:var(--accent); border-radius:3px; display:block; min-height:0}
.barlabels{display:flex; justify-content:space-between; padding:5px 12px 11px; font-size:10.5px; color:var(--ink-3)}

.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl td{padding:9px 12px; border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right; font-weight:600; white-space:nowrap}
.tbl td .s{display:block; font-size:11.5px; color:var(--ink-3); font-weight:400}

/* ---------- dialog ---------- */
dialog{
  border:0; padding:0; background:var(--surface); color:var(--ink);
  border-radius:18px 18px 0 0; width:100%; max-width:760px;
  margin:auto auto 0; max-height:92vh; max-height:92dvh;
}
dialog::backdrop{background:rgba(10,18,15,.55)}
.dlg-h{position:sticky; top:0; background:var(--surface); padding:16px 18px 12px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; z-index:2}
.dlg-h h3{margin:0; font-size:16px; font-weight:700; flex:1}
#dlgform{display:flex; flex-direction:column; max-height:92vh; max-height:92dvh}
.dlg-h, .dlg-f{flex:none}
.dlg-b{padding:16px 18px; overflow-y:auto; flex:1 1 auto; min-height:0; overscroll-behavior:contain}
.dlg-f{position:sticky; bottom:0; background:var(--surface); padding:12px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; gap:8px}
.dlg-f .btn{flex:1; min-width:0; white-space:nowrap; min-height:46px}
/* danh sách soạn đơn theo khách */
.pickrow{padding:12px 0; border-bottom:1px solid var(--line)}
.pickrow:last-child{border-bottom:0}
.pickrow .pr-h{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.pickrow .pr-h b{font-size:15px; font-weight:700}
.pickrow .pr-s{font-size:11.5px; color:var(--ink-3); margin-top:2px}
.pickrow .tbl td{padding:3px 0; font-size:13px}
/* thanh dưới có 3 nút: 2 nút phụ nhỏ lại, nút chính (nút cuối) to gấp đôi */
.dlg-f .btn.ghost{flex:0 1 auto; padding-left:10px; padding-right:10px; font-size:13.5px}
.dlg-f .btn:last-child{flex:2 1 auto}
.x{background:var(--surface-2); border:0; width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:17px; color:var(--ink-2); line-height:1}

/* login */
#login{max-width:340px; margin:0 auto; padding:14vh 24px 40px; text-align:center}
#login .brandmark{width:52px;height:52px;border-radius:15px;font-size:19px;margin:0 auto 16px}
#login h2{font-size:21px; font-weight:800; margin:0 0 5px; letter-spacing:-.02em}
#login p{color:var(--ink-3); font-size:13.5px; margin:0 0 26px}
#pinbox{display:flex; gap:9px; justify-content:center; margin-bottom:16px}
#pinbox b{width:44px; height:52px; border:1px solid var(--line-2); border-radius:11px; background:var(--sunken); display:grid; place-items:center; font-size:22px}
#pinbox b.f{border-color:var(--accent)}
.keys{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.keys button{height:54px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:20px; font-weight:500; cursor:pointer}
.keys button:active{background:var(--accent-soft)}
.err{color:var(--danger); font-size:13px; min-height:19px; margin-bottom:6px}

/* item picker rows */
.pick{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick .n{flex:1; min-width:0; font-size:14px}
.pick .n em{font-style:normal; display:block; font-size:11.5px; color:var(--ink-3)}
.pick input[type=number]{width:64px; text-align:center; background:var(--sunken); border:1px solid var(--line); border-radius:8px; padding:7px}

.note{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--ink-2); line-height:1.5}

/* ---------- chọn món nhanh ---------- */
.pickbar{position:sticky; top:0; z-index:3; background:var(--surface); padding:8px 0 9px; margin-bottom:2px}
.pickbar input{background:var(--sunken); border:1px solid var(--line-2); border-radius:9px; padding:10px 11px; width:100%; font-size:15px}
.quick{display:flex; gap:6px; overflow-x:auto; padding:8px 0 2px; scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qc{flex:none; background:var(--accent-soft); color:var(--accent-ink); border:1px solid transparent; border-radius:999px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap}
.qc:active{background:var(--accent); color:#fff}
.pick{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line); cursor:pointer}
.pick.on{background:var(--accent-soft); border-radius:10px; padding-left:9px; padding-right:9px; border-top-color:transparent}
.pick .n{flex:1; min-width:0; font-size:14px}
.pick .n em{font-style:normal; display:block; font-size:11.5px; color:var(--ink-3)}
.pick input[type=number]{width:58px; text-align:center; background:var(--surface); border:1px solid var(--line-2); border-radius:8px; padding:7px; font-size:15px}
.pick .mi{width:32px;height:34px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:17px;font-weight:600;color:var(--ink-2);flex:none}
.gtitle{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 2px}
.daygroup{margin-bottom:18px}
.dayhead{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding:8px 12px; margin-bottom:9px;
  background:var(--sunken); border:1px solid var(--line); border-radius:10px}
.dayhead b{font-size:14.5px; font-weight:700; font-variant-numeric:tabular-nums}
.dayhead span{font-size:11.5px; color:var(--ink-3)}

.langwrap{display:flex; gap:7px; margin-bottom:12px}
.lng{flex:1; padding:9px 6px; border-radius:9px; border:1.5px solid var(--line-2); background:var(--surface);
  font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-3)}
.lng.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.kmbtn{background:none; border:1px solid var(--line-2); border-radius:7px; padding:4px 9px;
  font-size:11.5px; font-weight:600; color:var(--accent); cursor:pointer}
.curwrap{display:flex; gap:6px; margin-bottom:7px}
.cur{flex:1; padding:8px 6px; border-radius:9px; border:1.5px solid var(--line-2); background:var(--surface);
  font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-3)}
.cur.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.paybtns{display:flex; gap:7px; margin-bottom:12px}
.pb{flex:1; padding:13px 6px; border-radius:11px; border:1.5px solid var(--line-2); background:var(--surface);
  font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-2)}
.pb.on.pb-chua{background:var(--danger-soft); border-color:var(--danger); color:var(--danger)}
.pb.on.pb-coc{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.pb.on.pb-da{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}

.xline{display:flex; gap:6px; align-items:center; margin-bottom:7px}
.xline input{background:var(--sunken); border:1px solid var(--line-2); border-radius:8px; padding:9px 10px; font-size:14px; min-width:0}
.xline .xn{flex:1}
.xline .xq{width:56px; text-align:center}
.xline .xp{width:72px; text-align:center}
.custbox{background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px;
  padding:10px 12px; margin:-4px 0 12px; font-size:12.5px; color:var(--accent-ink); line-height:1.5}
.custbox b{color:var(--accent-ink)}
.custbox .addr{color:var(--ink-2); display:block; margin-top:2px}
.custbox button{margin-top:8px; background:var(--accent); color:#fff; border:0; border-radius:8px;
  padding:7px 12px; font-size:12.5px; font-weight:600; cursor:pointer}

.addrmiss{background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:8px 11px;
  font-size:12.5px; margin-top:6px; line-height:1.5}
.addrok{background:var(--accent-soft); color:var(--accent-ink); border-radius:8px; padding:8px 11px;
  font-size:12.5px; margin-top:6px; font-weight:600}
.xnote{width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
  padding:7px 10px; font-size:12.5px; margin:-3px 0 9px; color:var(--warn)}
.xline .mi{width:34px; height:36px; border-radius:8px; border:1px solid var(--line-2); background:var(--surface); cursor:pointer; font-size:15px; color:var(--ink-2); flex:none}
.xline .mi:active{background:var(--accent-soft)}

.picksum{position:sticky; bottom:-1px; background:var(--surface); border-top:1px solid var(--line); padding:10px 0; margin-top:8px; display:flex; align-items:center; gap:8px; font-size:13px; z-index:3}
.picksum b{margin-left:auto; font-size:16px}

/* ---------- bill ---------- */
#printarea{display:none}
.bill{background:#fff; color:#12100e; border-radius:12px; padding:20px 18px; border:1px solid var(--line);
  font-family:"Be Vietnam Pro", system-ui, sans-serif; font-size:12.5px; line-height:1.55}
/* chỉ CỘT TIỀN mới dùng font số — font đó không ghép được dấu tiếng Việt */
.bill table td:last-child, .bill .tot span:last-child{font-family:"IBM Plex Mono", ui-monospace, monospace}
.bill .bh{text-align:center; margin-bottom:14px}
.bill .bh b{display:block; font-family:"Be Vietnam Pro", sans-serif; font-size:17px; font-weight:800; letter-spacing:-.01em}
.bill .bh span{display:block; font-size:10.5px; color:#6b6a66; margin-top:2px}
.bill hr{border:0; border-top:1px dashed #c9c6c0; margin:11px 0}
.bill .kv{display:flex; justify-content:space-between; gap:10px}
.bill .kv span:first-child{color:#6b6a66}
.bill table{width:100%; border-collapse:collapse; font-size:12px}
.bill table th{text-align:left; font-weight:600; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#6b6a66; padding-bottom:5px; border-bottom:1px solid #ddd9d3}
.bill table th:last-child, .bill table td:last-child{text-align:right}
.bill table td{padding:5px 0; vertical-align:top}
.bill table td:nth-child(2){text-align:center; white-space:nowrap; color:#6b6a66}
.bill .tot{display:flex; justify-content:space-between; font-size:15px; font-weight:700; font-family:"Be Vietnam Pro",sans-serif}
.bill .ft{text-align:center; font-size:10.5px; color:#6b6a66; margin-top:12px; line-height:1.7; font-family:"Be Vietnam Pro",sans-serif}
.bill .ft b{color:#12100e}
@media print{
  body > *{display:none !important}
  #printarea{display:block !important}
  #printarea .bill{border:0; border-radius:0; padding:0; font-size:11.5px}
  @page{margin:12mm}
}
.savechip{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); font-size:12px; font-weight:600;
  padding:7px 14px; border-radius:999px; z-index:60; opacity:0; pointer-events:none;
  transition:opacity .2s;
}
.savechip.on{opacity:1}
.hidden{display:none!important}
</style>

function rate(){ return (DB.rate && DB.rate > 0) ? DB.rate : DEFAULT_RATE; }
function vnd(n){ return Math.round(n).toLocaleString("vi-VN") + "₫"; }
function sgdFromVnd(v){ return +(v / rate()).toFixed(2); }
function vndFromSgd(s){ return Math.round(s * rate()); }
/* "400.000" · "400k" · "400 nghìn" → 400000 */
function parseVndNumber(s){
  let t = String(s||"").toLowerCase().replace(/\s/g,"");
  const kMul = /(k|ngh[iì]n|ngan|ng[aà]n)$/.test(t) ? 1000 : (/(tr|tri[eệ]u|m)$/.test(t) ? 1000000 : 1);
  t = t.replace(/(k|ngh[iì]n|ngan|ng[aà]n|tr|tri[eệ]u|m|đ|d|vnd|vnđ)$/g,"");
  t = t.replace(/[.,](?=\d{3}\b)/g,"");        /* 400.000 → 400000 */
  t = t.replace(",", ".");
  const n = parseFloat(t);
  return isNaN(n) ? 0 : n * kMul;
}

const LS = "3sis_db_v1";
const OUTBOX = "3sis_outbox";

function localSave(){ try{ localStorage.setItem(LS, JSON.stringify(DB)); }catch(e){} }
function localLoad(){ try{ const s=localStorage.getItem(LS); return s?JSON.parse(s):null; }catch(e){ return null; } }

function mergeUp(list, rec, key){
  const i = list.findIndex(x=>x[key]===rec[key]);
  if(i>=0) list[i]=rec; else list.push(rec);
}
function readOutbox(){ try{ return JSON.parse(sessionStorage.getItem(OUTBOX)||"[]"); }catch(e){ return []; } }
function writeOutbox(a){ try{ sessionStorage.setItem(OUTBOX, JSON.stringify(a)); }catch(e){} }
function pushOutbox(kind, rec){
  const a = readOutbox();
  a.push({kind, rec});
  if(a.length>200) a.splice(0, a.length-200);
  writeOutbox(a);
}
function applyOutbox(){
  const a = readOutbox();
  if(!a.length) return false;
  a.forEach(o=>{
    if(o.kind==="order") mergeUp(DB.orders, o.rec, "id");
    else if(o.kind==="item") mergeUp(DB.items, o.rec, "sku");
    else if(o.kind==="buy") mergeUp(DB.buy, o.rec, "id");
    else if(o.kind==="settings") DB.pins = o.rec;
  });
  return true;
}

let saveTimer = null, saving = false, dirty = false;
function save(){
  localSave();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
async function flush(){
  if(!dirty || saving) return;
  if(SAVE_MODE !== "cloud"){ dirty=false; return; }
  saving = true;
  const snapshot = JSON.stringify(DB);
  try{
    await ART.publish({"data/db.json": {content: snapshot, contentType:"application/json"}});
    dirty = false;
    writeOutbox([]);
    toast("Đã lưu · mọi người thấy ngay");
  }catch(err){
    const c = err && err.code;
    if(c === "conflict"){
      // người khác vừa lưu — bản mới đang tải lại, outbox sẽ được ghép vào
    }else if(c === "not_writer" || c === "not_granted"){
      SAVE_MODE = "readonly"; toast("Tài khoản này chỉ được xem");
    }else if(c === "capability_disabled" || c === "capability_removed" || c === "not_declared"){
      SAVE_MODE = "local"; toast("Chỉ lưu trên máy này");
    }else if(c === "rate_limited"){
      setTimeout(()=>{ saving=false; flush(); }, 4000);
    }else{
      toast("Lưu lỗi — thử lại sau");
      setTimeout(()=>{ saving=false; flush(); }, 6000);
    }
  }finally{
    if(saving) saving = false;
  }
}

const $ = s => document.querySelector(s);

const pad = n => String(n).padStart(2,"0");
function todayStr(d){ d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function viDate(s){

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function orderTotal(o){ return (o.items||[]).reduce((s,i)=> s + i.qty*i.price, 0); }

function itemKg(it){

/* ---- khuyến mãi có điều kiện ---- */
function promoAmount(p, subtotal){
  return +(p.kind === "percent" ? subtotal * p.value / 100 : Math.min(p.value, subtotal)).toFixed(2);
}
/* các khuyến mãi mà đơn này đủ điều kiện, sắp theo mức giảm nhiều nhất */
function eligiblePromos(brand, subtotal, kg){
  return (DB.promos||[]).filter(p=> p.active !== false
      && (p.brand === "all" || p.brand === brand)
      && subtotal >= (p.minTotal||0)
      && kg >= (p.minKg||0)
      && subtotal > 0)
    .map(p=> ({p, amount: promoAmount(p, subtotal)}))
    .sort((a,b)=> b.amount - a.amount);
}
function promoCond(p){
  const c = [];

  if(p.minKg > 0) c.push("từ " + p.minKg + " kg");

function promoValueTxt(p){ return p.kind === "percent" ? "giảm " + p.value + "%" : "giảm " + money(p.value); }
function orderDisc(o){ return +(((o.discount)||0) + ((o.manualDiscount)||0)).toFixed(2); }
/* tiền trả lại khách vì hàng hư / trả hàng */
function orderRefund(o){ return +((o.returns||[]).reduce((s,r)=> s + (r.amount||0), 0)).toFixed(2); }
/* số tiền khách thực trả sau khuyến mãi */
function orderNet(o){ return Math.max(0, +(orderTotal(o) - orderDisc(o) - orderRefund(o)).toFixed(2)); }
function kgTxt(n){ return (Math.round(n*100)/100) + " kg"; }
/* mở combo thành từng món con để kho soạn và để trừ kho */
function expandLine(line){

    }).filter(Boolean);

  return [{sku:line.sku, name:line.name, unit:line.unit, qty:line.qty, kg:line.kg||0, from:null, note:line.note||""}];

/* gom tất cả món con của một đơn, cộng dồn theo mặt hàng */
function orderParts(o){
  const m = {};
  (o.items||[]).forEach(l=> expandLine(l).forEach(p=>{
    if(!m[p.sku]) m[p.sku] = {sku:p.sku, name:p.name, unit:p.unit, qty:0, kg:p.kg, from:p.from, note:p.note||""};

/* ---- MÃ BILL: YYMMDD ngày giao + số thứ tự trong ngày đó (26082501) ---- */
function yymmdd(d){ const p = String(d||todayStr()).split("-"); return p[0].slice(2) + p[1] + p[2]; }
function nextBillCode(date, selfId){

/* ---- ĐỊA CHỈ SINGAPORE: bắt buộc có #tầng-căn, tên đường, mã bưu chính 6 số ---- */
function checkAddress(a){
  const s = String(a||"").trim();
  const miss = [];
  /* #05-67 · hoặc tầng hầm ghi kiểu B2-38A (Orchard, Marina…) không có dấu # */
  const UNIT_RE = /#\s*\d{1,3}\s*[-–—]\s*\d{1,4}[A-Za-z]?|\bB\s*\d{1,2}\s*[-–—]\s*\d{1,4}[A-Za-z]?\b/;
  if(!UNIT_RE.test(s)) miss.push("số tầng dạng #05-67");
  if(!/(?:^|[^\d])\d{6}(?![\d])/.test(s)) miss.push("mã bưu chính 6 số");
  const body = s.replace(new RegExp(UNIT_RE.source,"g"),"").replace(/\d{6}/g,"").replace(/[^\p{L}\s]/gu," ").trim();
  if(body.replace(/\s+/g,"").length < 5) miss.push("tên đường hoặc tên toà nhà");
  return {ok: miss.length === 0, miss};
}
/* bỏ dấu để tìm "xoai" ra "Xoài" */
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/\s+/g," ").trim(); }
/* món hay đặt nhất, lấy từ lịch sử đơn */
function topItems(n){

  DB.orders.forEach(o=> (o.items||[]).forEach(i=> c[i.sku] = (c[i.sku]||0)+1 ));
  const ranked = DB.items.slice().sort((a,b)=> (c[b.sku]||0)-(c[a.sku]||0));

/* tìm mặt hàng gần đúng nhất theo tên gõ vào */
function matchItem(txt){
  const n = norm(txt); if(!n) return null;
  let best = null, score = 0;
  DB.items.forEach(it=>{
    const s = norm(it.name);
    let v = 0;
    if(s === n) v = 100;
    else if(s.indexOf(n) === 0) v = 85;
    else if(s.indexOf(n) > -1) v = 70;
    else{
      const w = n.split(" ").filter(x=>x.length>1);
      const hit = w.filter(x=> s.indexOf(x) > -1).length;
      if(w.length && hit) v = 55 * hit / w.length;
    }
    if(v > score){ score = v; best = it; }
  });
  return score >= 40 ? best : null;
}
/* "2 xoài" · "xoài 2kg" · "3 hộp sầu riêng" → {item, qty} */
function parseLine(line){
  const raw = line.replace(/^[\-•*\d]+[.)]\s*/, "").trim();
  if(!raw) return null;
  let m = raw.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|hop|hộp|phan|phần|cai|cái|goi|gói|chai|cay|cây|con|ky|ký|lo|lọ|thung|thùng|x)?\s*[x×]?\s*(.+)$/i);
  if(m && m[3]) { const it = matchItem(m[3]); if(it) return {item:it, qty:parseFloat(m[1].replace(",","."))}; }
  m = raw.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*[a-zA-ZÀ-ỹ]{0,6}$/);
  if(m) { const it = matchItem(m[1]); if(it) return {item:it, qty:parseFloat(m[2].replace(",","."))}; }
  const it = matchItem(raw);
  return it ? {item:it, qty:1} : null;
}

/* "55,9" → 55.9 · "1,200" → 1200 */
function num(s){
  let v = String(s==null?"":s).trim().replace(/\s/g,"").replace(/[^\d.,-]/g,"");
  if(/,\d{1,2}$/.test(v) && !/\.\d/.test(v)) v = v.replace(/\./g,"").replace(",", ".");
  else v = v.replace(/,/g,"");
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
/* ---- TÁCH ĐƠN VỊ RA KHỎI TÊN MÓN ----
   "3 cái bánh bao" → SL 3 · đơn vị "cái" · món "Bánh bao"
   "10 ổ bánh mì không" → SL 10 · đơn vị "ổ" · món "Bánh mì không"      */
const UNIT_ACCENT = ["cái","chiếc","ổ","bịch","gói","hộp","ký","gram","gam","set","phần","cây","chai",
  "lọ","thùng","con","túi","bó","vỉ","khay","hũ","hủ","lon","bao","miếng","lát","xâu","tô","dĩa","đĩa",
  "ly","cốc","suất","khúc","quả","buồng","nải","chùm","cặp","đôi","kg","g","gr","kí"];
/* danh sách không dấu — chỉ những chữ không đụng nghĩa khác (bỏ bo/bò, to/tô, cay/cây…) */
const UNIT_PLAIN = ["cai","chiec","bich","goi","hop","kg","ky","gram","gam","gr","set","phan","chai",
  "thung","tui","khay","lon","mieng","lat","xau","dia","suat","chum","cap","vi","khuc"];
function splitUnit(name){
  const raw = String(name||"").trim();
  const words = raw.split(/\s+/);
  if(words.length < 2) return {name:raw, unit:""};
  const w0 = words[0].toLowerCase().replace(/[^\p{L}]/gu, "");
  const hit = UNIT_ACCENT.indexOf(w0) > -1 || UNIT_PLAIN.indexOf(norm(w0)) > -1;
  if(!hit) return {name:raw, unit:""};
  const rest = words.slice(1).join(" ").trim();
  if(rest.replace(/[^\p{L}\p{N}]/gu,"").length < 2) return {name:raw, unit:""};
  return {name: rest.charAt(0).toUpperCase() + rest.slice(1), unit: words[0].toLowerCase()};
}

/* "thứ 3, 25/08/2026" → "2026-08-25" */
function parseVNDate(s){
  const m = String(s||"").match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);
  if(!m) return "";
  let y = m[3]; if(y.length === 2) y = "20" + y;
  const mm = +m[2], dd = +m[1];
  if(mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
  return y + "-" + pad(mm) + "-" + pad(dd);
}

/* "Thuy Sang - MT" → {name:"Thuy Sang", agent:"MT"} · "Chị Lan - Tampines" giữ nguyên */
/* mã nhân viên hay ghi kèm mã page: "MT- VSF", "JCN -3SIS", "TH-DINH" */
function brandFromAgent(code){
  const parts = String(code||"").toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  for(let i = 0; i < parts.length; i++) if(CODEBRAND[parts[i]]) return CODEBRAND[parts[i]];
  return "";
}
function splitAgent(s){
  const t = String(s||"").trim();
  /* nhận mã tối đa 7 ký tự chữ-số, hoặc dài hơn nhưng có chứa mã page đã biết */
  function ok(raw){
    const asIs = raw.trim();
    const code = asIs.toUpperCase().replace(/\s+/g,"");
    const bare = code.replace(/[^A-Z0-9]/g,"");
    if(!bare) return null;
    /* Chỉ coi là MÃ khi nhân viên viết IN HOA (MT · CL · TH-DINH · MT- VSF),
       hoặc có chứa mã page đã biết. "Vi - Angelina Tran" → Angelina Tran là
       TÊN KHÁCH, không phải mã, nên không tách.                            */
    const looksLikeCode = /^[A-Z0-9\s\-–—]+$/.test(asIs) || !!brandFromAgent(code);
    if(!looksLikeCode) return null;
    return (bare.length <= 7 || brandFromAgent(code)) ? code : null;
  }
  let m = t.match(/^(.+?)\s*[-–—\/|]\s*([A-Za-z0-9\s\-–—]{1,16})$/);
  if(m && m[1].trim()){ const c = ok(m[2]); if(c) return {name:m[1].trim(), agent:c}; }
  m = t.match(/^(.+?)\s*[\(\[]\s*([A-Za-z0-9\s\-–—]{1,16})\s*[\)\]]\s*$/);
  if(m && m[1].trim()){ const c = ok(m[2]); if(c) return {name:m[1].trim(), agent:c}; }
  return {name:t, agent:""};
}

/* nhóm hàng: các nhóm chuẩn cộng thêm nhóm lạ có sẵn trong kho */
function allGroups(){

/* ---- ĐỌC GIÁ TRONG MỘT MẨU CHỮ ----
   Nhận cả 3 kiểu nhân viên hay gõ:  "$36"  ·  "36$"  ·  "36 sgd"  ·  "S$36"      */
/* lưu ý: kiểu "36$" không được ăn nhầm chữ số của kiểu "$68" đứng ngay sau
   (vd "1 Combo 2 $68" — "2 $" không phải giá) → chặn bằng (?!\s*\d) */
const PRICE_RE = /(?:s\s*)?[\$₫]\s*(\d+(?:[.,]\d{1,3})?)|(\d+(?:[.,]\d{1,3})?)\s*(?:(?:s\s*)?[\$₫]|sgd|usd)(?!\s*[\d.,])/i;
function hasPrice(s){ return PRICE_RE.test(String(s||"")); }
function priceFind(s){
  const m = String(s||"").match(PRICE_RE);
  if(!m) return null;
  return {value: num(m[1] != null ? m[1] : m[2]), text: m[0], index: m.index};
}
/* dòng tổng kết — không phải món */
const NOT_ITEM_RE = /^(?:t[oổ]ng|total|subtotal|grand|th[aà]nh\s*ti[eề]n|c[oò]n\s*l[aạ]i|s[oố]\s*ti[eề]n|amount|đã\s*tr[aả]|ph[aả]i\s*thu)/i;
const SHIP_NAME_RE = /^(?:ship|phi\s*ship|phi\s*giao|phi\s*giao\s*hang|giao\s*hang|van\s*chuyen|delivery|freight)$/i;
/* một mẩu chữ có giá → một dòng món */
function parseItemSeg(seg){
  let s = String(seg||"").replace(/^[-•*+\s]+/, "").trim();
  /* bỏ số thứ tự đầu dòng: "1. 2 Cơm Tấm $36" → "2 Cơm Tấm $36" */
  s = s.replace(/^\d{1,2}\s*[.)]\s+(?=\S)/, "").trim();
  if(!s || NOT_ITEM_RE.test(s)) return null;
  let note = "";
  s = s.replace(/[\(\[]([^\)\]]*)[\)\]]/g, function(_, g){ note = (note ? note + " " : "") + String(g).trim(); return " "; });
  const pr = priceFind(s);
  if(!pr) return null;
  s = (s.slice(0, pr.index) + " " + s.slice(pr.index + pr.text.length)).replace(/\s+/g, " ").trim();
  /* Nhân viên hay ghi phép tính phía sau: "$45,9 x 2 = $91,80 - 5% = $87.2".
     Cắt bỏ từ dấu "=" trở đi, nhưng giữ lại phần trăm giảm làm ghi chú.   */
  const eq = s.indexOf("=");
  if(eq > -1){
    const tail = s.slice(eq);
    const pc = tail.match(/(\d+(?:[.,]\d+)?)\s*%/);
    if(pc) note = (note ? note + " " : "") + "khách ghi giảm " + pc[1] + "%";
    s = s.slice(0, eq).trim();
  }
  s = s.replace(/^[-–—:,x×\s]+/, "").replace(/[-–—:,\s]+$/, "").trim();
  let qty = 0;
  const q = s.match(/^(\d+(?:[.,]\d+)?)\s*[x×]?\s+(.+)$/);
  if(q){ qty = num(q[1]); s = q[2].trim(); }
  /* số lượng viết đuôi: "Cơm Tấm x2" */
  if(!qty){
    const q2 = s.match(/^(.*\p{L}.*?)\s*[x×]\s*(\d+(?:[.,]\d+)?)$/u);
    if(q2){ qty = num(q2[2]); s = q2[1].trim(); }
  }else{
    /* đã có số lượng ở đầu rồi thì đuôi "x 2" chỉ là phép nhân — bỏ đi */
    s = s.replace(/\s*[x×]\s*\d+(?:[.,]\d+)?\s*$/i, "").trim();
  }
  if(!s || !/\p{L}/u.test(s)) return null;
  if(SHIP_NAME_RE.test(norm(s).replace(/\s+/g, " ")))
    return {name:"Phí giao hàng", qty:1, unit:"đơn", price:pr.value, note:note};
  const su = qty ? splitUnit(s) : {name:s, unit:""};
  const nm = su.name.charAt(0).toUpperCase() + su.name.slice(1);
  return {name:nm, qty: qty || 1, unit:su.unit, price:pr.value, note:note};
}
/* "2 Cơm Tấm 36$ + 2 canh khổ qua 20$ + 10$ Ship" → 3 món riêng
   Tách cả dấu +, dấu phẩy và chữ "và" — nhưng CHỈ khi tách ra có từ 2 giá trở lên,
   để không cắt nhầm ghi chú hay địa chỉ.                                        */
function splitSegs(line){
  /* giữ dấu phẩy thập phân ($45,9) lại, đừng cắt ngay giữa số tiền */
  const keep = String(line||"").replace(/(\d)\s*,\s*(\d)/g, "$1$2");
  const parts = keep.split(/\s*\+\s*|\s*,\s*|\s+v[aà]\s+/i).map(x=> x.replace(//g, ","));
  if(parts.length < 2) return [line];
  let n = 0; parts.forEach(p=>{ if(hasPrice(p)) n++; });
  return n >= 2 ? parts : [line];
}
/* dòng chỉ có mỗi con số tiền: "$59.9" · "59,9" · "59.9$" */
function isPriceOnly(s){
  const t = String(s||"").trim();
  if(!t) return false;
  if(/^(?:s\s*)?[\$₫]\s*\d+(?:[.,]\d{1,3})?$/i.test(t)) return true;              /* $59.9 */
  if(/^\d+(?:[.,]\d{1,3})?\s*(?:(?:s\s*)?[\$₫]|sgd|usd)$/i.test(t)) return true;  /* 59.9$ */
  if(/^\d{1,4}[.,]\d{1,2}$/.test(t)) return true;                                 /* 59.9  */
  if(/^\d{1,4}$/.test(t)) return true;                                            /* 58    */
  return false;   /* số dài 5+ chữ số trần = sđt / mã bưu chính, KHÔNG phải giá */
}
/* dòng có nhãn (sđt, đ/c, ngày giao…) — không phải tên món */
const LABEL_RE = /^(?:s[đd]t|so\s*dien|số\s*điện|phone|tel|hp|[đd]\s*t\b|mobile|contact|[đd]\s*\/?\s*c\b|địa\s*chỉ|dia\s*chi|address|addr|ngay|ngày|order|deliver|ship|phí|phi|free\s*?ship|đã|da\s|chưa|c[oọ]c|deposit|t[oổ]ng|total|subtotal|grand|th[aà]nh\s*ti[eề]n|paynow|pay\s*now)/i;

/* Đọc nguyên tin nhắn đặt hàng của nhân viên.
   Nhận mẫu:  1. Tên - MT / Sđt : ... / Đ/c : ... / 1 món $55,9 (ghi chú)
              Freeship / Đã cọc $20 / Ngay order : .. / Ngày giao : .. */
function parseOrderMsg(txt){
  const out = {customer:"", phone:"", address:"", odate:"", date:"", deposit:0, freeship:false,
               pay:"", payMethod:"", agent:"", brand:"", vnd:false, depositVnd:0, lines:[], note:"", total:0};
  const rest = [];
  let addrMode = false;

  /* ---- hình thức trả tiền ---- */
  const all = String(txt||"");
  if(/pay\s*now|paynow/i.test(all)) out.payMethod = "PayNow";
  else if(/chuy[eể]n\s*kho[aả]n|\bck\b|bank|transfer|banking/i.test(all)) out.payMethod = "Chuyển khoản";
  else if(/ti[eề]n\s*m[aặ]t|\bcash\b|\bcod\b/i.test(all)) out.payMethod = "Tiền mặt";
  /* ---- GHÉP GIÁ Ở DÒNG DƯỚI VÀO TÊN MÓN ----
     "1 thùng sữa Vinamilk có đường loại túi"
     "$59.9"                                   → một món, giá 59.9        */
  const src = String(txt||"").split(/\r?\n/);
  const rows = [];
  for(let i = 0; i < src.length; i++){
    const cur = String(src[i]).trim(), nxt = i + 1 < src.length ? String(src[i+1]).trim() : "";
    if(nxt && isPriceOnly(nxt) && /\p{L}/u.test(cur) && !hasPrice(cur)
       && !LABEL_RE.test(cur) && !NOT_ITEM_RE.test(cur)){
      rows.push(cur + " " + nxt); i++; continue;
    }
    rows.push(src[i]);
  }
  rows.forEach(line0=>{
    let line = String(line0).trim();
    line = line.replace(/^(\d+(?:[.,]\d+)?)(kg|g|gr|ml|l)\b/i, "$1 $2 ");
    if(!line || /^[-–—=_*·.]{2,}$/.test(line)){ addrMode = false; return; }
    let m;

    if((m = line.match(/^(?:s[đd]t|so\s*dien\s*thoai|số\s*điện\s*thoại|phone|tel|hp|[đd]\s*t|mobile|contact)\s*[:.\-]?\s*(.+)$/i))){
      const d = m[1].replace(/\D/g,"");
      if(d.length >= 8) out.phone = d.slice(-8);
      addrMode = false; return;
    }
    /* nhãn tiếng Anh: Order: 2/9/2026 · Delivery: 2/9/2026 */
    if((m = line.match(/^(?:order(?:\s*date)?|ordered|đặt\s*ngày)\s*[:.\-]\s*(.+)$/i))){
      out.odate = parseVNDate(m[1]); addrMode = false; return;
    }
    if((m = line.match(/^(?:deliver(?:y|ed)?(?:\s*date)?|ship(?:ping)?\s*date|giao\s*ngày)\s*[:.\-]\s*(.+)$/i))){
      out.date = parseVNDate(m[1]); addrMode = false; return;
    }
    if((m = line.match(/^(?:[đd]\s*\/?\s*c|địa\s*chỉ|dia\s*chi|address|addr)\s*[:.\-]?\s*(.+)$/i))){
      out.address = m[1].trim(); addrMode = true; return;
    }
    if((m = line.match(/^(?:ngay|ngày)\s*(?:order|đặt|dat|nhận|nhan)\s*[:.\-]?\s*(.+)$/i))){
      out.odate = parseVNDate(m[1]); addrMode = false; return;
    }
    if((m = line.match(/^(?:ngay|ngày)\s*(?:giao|ship|gửi|gui)\s*[:.\-]?\s*(.+)$/i))){
      out.date = parseVNDate(m[1]); addrMode = false; return;
    }
    /* ---- CHƯA thu / COD ---- */
    if(/ch[uư]a\s*(?:thu|thanh\s*to[aá]n|tr[aả]|ck|chuy[eể]n|c[oọ]c|nh[aậ]n\s*ti[eề]n)|\bcod\b|thu\s*(?:ti[eề]n\s*)?khi\s*giao|nh[aậ]n\s*h[aà]ng\s*(?:m[oớ]i\s*)?tr[aả]|tr[aả]\s*sau|n[oợ]\s*l[aạ]i/i.test(line)){
      out.pay = "chua"; addrMode = false; return;
    }
    /* ---- ĐÃ THU ĐỦ ---- */
    if(/(?:thu|thanh\s*to[aá]n|tr[aả]|chuy[eể]n|ck)\s*đ[uủ]|đ[uủ]\s*ti[eề]n|đã\s*thanh\s*to[aá]n|đã\s*tr[aả]|đã\s*chuy[eể]n\s*kho[aả]n|đã\s*ck\b|đã\s*thu|đã\s*nh[aậ]n\s*ti[eề]n|xong\s*ti[eề]n|\bpaid\b|full\s*payment/i.test(line)
       && !/c[oọ]c/i.test(line)){
      out.pay = "da"; addrMode = false; return;
    }
    /* ---- ĐÃ CỌC (số tiền) ---- */
    if((m = line.match(/(?:đã\s*)?(?:đặt\s*)?(?:cọc|coc|deposit)\s*(?:ti[eề]n\s*vi[eệ]t|vnd|vnđ)?\s*[:.\-]?\s*[\$₫]?\s*([\d.,]+\s*(?:k|ngh[iì]n|ng[aà]n|tr|tri[eệ]u)?)\s*(đ|vnd|vnđ|đồng|dong)?/i))){
      const isVnd = /ti[eề]n\s*vi[eệ]t|vnd|vnđ|đồng|dong/i.test(line) || /[\d][.,]\d{3}/.test(m[1]) || !!m[2]
                    || /(k|ngh[iì]n|ng[aà]n|tr|tri[eệ]u)\s*$/i.test(m[1]);
      if(isVnd){
        out.depositVnd = parseVndNumber(m[1]);
        out.deposit = sgdFromVnd(out.depositVnd);
        out.vnd = true;
      }else{
        out.deposit = num(m[1]);
      }
      if(out.pay !== "da") out.pay = "coc";
      addrMode = false; return;
    }
    /* ---- ĐÃ CỌC (không ghi số) ---- */
    if(/^(?:đã\s*)?(?:đặt\s*)?c[oọ]c\b/i.test(line)){
      if(out.pay !== "da") out.pay = "coc";
      addrMode = false; return;
    }
    if(/free\s*ship|freeship|mi[eễ]n\s*(?:phí\s*)?ship/i.test(line)){ out.freeship = true; addrMode = false; return; }
    if((m = line.match(/^(?:ship|phí\s*ship|phi\s*ship|phí\s*giao|v[aậ]n\s*chuy[eể]n)\s*[:.\-]?\s*[\$₫]?\s*([\d.,]+)/i))){
      out.lines.push({name:"Phí giao hàng", qty:1, unit:"đơn", price:num(m[1]), note:""}); addrMode = false; return;
    }
    /* dòng tổng kết: "Tổng: $66" — không phải món, nhưng nhớ lại để đối chiếu */
    if(NOT_ITEM_RE.test(line)){
      if(/^(?:t[oổ]ng|total|subtotal|grand|th[aà]nh\s*ti[eề]n)/i.test(line)){
        const pt = priceFind(line); if(pt) out.total = pt.value;
        else { const n2 = line.match(/([\d][\d.,]*)\s*$/); if(n2) out.total = num(n2[1]); }
      }
      addrMode = false; return;
    }
    /* địa chỉ viết trần, không có chữ "Đ/c" — nhận ra nhờ mã bưu chính 6 số */
    if(!out.address && /(?:^|[^\d])\d{6}(?![\d])/.test(line) && /\p{L}/u.test(line) && !hasPrice(line)){
      /* KHÔNG bật addrMode: dòng này không có nhãn "Đ/c", dòng kế tiếp
         thường đã là món — bật lên là nuốt luôn món vào địa chỉ. */
      out.address = line.replace(/^[-•*\s]+/, "").trim(); addrMode = false; return;
    }
    /* dòng món có giá — nhận "$55,9" lẫn "36$", nhiều món nối bằng dấu +
       "1 set vịt quay tì bà $55,9 ( chặt sẵn )"
       "2 Cơm Tấm 36$ + 2 canh khổ qua 20$ + 10$ Ship"                    */
    if(hasPrice(line) && !NOT_ITEM_RE.test(line)){
      const got = [];
      splitSegs(line).forEach(sg=>{ const it = parseItemSeg(sg); if(it) got.push(it); });
      if(got.length){ got.forEach(g=> out.lines.push(g)); addrMode = false; return; }
    }
    /* mã nhân viên ghi riêng một dòng */
    if((m = line.match(/^(?:m[aã]\s*)?(?:nv|nh[aâ]n\s*vi[eê]n|sale|staff)\s*[:.\-]\s*([A-Za-z0-9]{1,6})\s*$/i))){
      out.agent = m[1].toUpperCase(); addrMode = false; return;
    }
    if(!out.customer && (m = line.match(/^\d+\s*[.)]\s*(.+)$/))){
      const s = splitAgent(m[1]); out.customer = s.name; if(s.agent && !out.agent) out.agent = s.agent;
      addrMode = false; return;
    }
    if(!out.customer && (m = line.match(/^(?:tên|ten|khách|khach|name|kh)\s*[:.\-]\s*(.+)$/i))){
      const s = splitAgent(m[1]); out.customer = s.name; if(s.agent && !out.agent) out.agent = s.agent;
      addrMode = false; return;
    }
    /* món ghi thiếu giá: "2 canh khổ qua" → vẫn nhận thành món, giá 0 để nhân viên điền
       (thà để nhân viên gõ giá còn hơn nuốt mất món khách đã đặt) */
    if(!addrMode && !LABEL_RE.test(line)
       && /^(?:[-•*]\s*)?\d+(?:[.,]\d+)?\s+\p{L}{2}/u.test(line)
       && !/\d{1,2}\s*[\/\-.]\s*\d{1,2}\s*[\/\-.]\s*\d{2}/.test(line)){
      const g = parseItemSeg(line + " $0");
      if(g){ out.lines.push(g); return; }
    }
    if(addrMode){ out.address = (out.address + " " + line).trim(); return; }
    rest.push(line);
  });

  if(!out.customer && rest.length && rest[0].length < 60){
    const s = splitAgent(rest.shift());
    out.customer = s.name; if(s.agent && !out.agent) out.agent = s.agent;
  }
  if(!out.phone){ const p = String(txt||"").match(/\b([689]\d{3})[\s-]?(\d{4})\b/); if(p) out.phone = p[1] + p[2]; }
  /* Nhân viên hay ghi giá là TIỀN CẢ DÒNG ("2 Cơm Tấm $36" = $36 cho 2 phần).
     Có dòng "Tổng:" thì lấy đó làm trọng tài — khớp tổng dòng thì chia ra đơn giá. */
  if(out.total > 0 && out.lines.length){
    let perUnit = 0, perLine = 0;
    out.lines.forEach(l=>{ perUnit += l.qty * l.price; perLine += l.price; });
    if(Math.abs(perLine - out.total) < 0.02 && Math.abs(perUnit - out.total) > 0.02){
      out.lines.forEach(l=>{ if(l.qty > 1) l.price = +(l.price / l.qty).toFixed(2); });
      rest.push("Giá ghi là tiền cả dòng — app đã chia ra đơn giá");
    }
  }else if(out.lines.length){
    /* Không có dòng Tổng → lấy giá trong Kho làm chuẩn.
       "2 Cơm Tấm $36" mà Kho ghi Cơm Tấm $18 → hiểu $36 là tiền cả dòng.
       "10 ổ bánh mì $2" mà Kho ghi $2 → giữ nguyên là đơn giá.            */
    let fixed = 0;
    out.lines.forEach(l=>{
      if(l.qty <= 1 || !(l.price > 0)) return;
      const it = matchItem(l.name);
      if(!it || !(it.price > 0)) return;
      const dUnit = Math.abs(l.price - it.price);
      const dLine = Math.abs(l.price / l.qty - it.price);
      if(dLine < dUnit && dLine <= it.price * 0.15){
        l.price = +(l.price / l.qty).toFixed(2); fixed++;
      }
    });
    if(fixed) rest.push("Giá ghi là tiền cả dòng — app đã chia ra đơn giá theo giá Kho");
  }
  if(!out.address){
    const post = String(txt||"").match(/\bS?(\d{6})\b/);
    if(post){ const l = String(txt||"").split(/\r?\n/).find(x=> x.includes(post[1])); if(l) out.address = l.trim(); }
  }
  if(out.agent) out.brand = brandFromAgent(out.agent) || "";
  /* dòng chỉ có mỗi số điện thoại thì đã lấy vào ô sđt rồi — đừng để lọt vào Ghi chú */
  const restClean = rest.filter(x=>{
    const t = String(x).trim();
    const digits = t.replace(/\D/g, "");
    return !(digits.length >= 8 && t.replace(/[\d\s+()\-.]/g, "").length === 0);
  });
  out.note = restClean.join(" · ");
  if(out.freeship) out.note = (out.note ? out.note + " · " : "") + "Freeship";
  return out;
}

/* tách thông tin từ tin nhắn khách dán vào */
function parseMsg(txt){
  const out = {name:"", phone:"", address:"", note:txt.trim()};
  const phone = txt.match(/(?:\+?65[\s-]?)?([89]\d{3}[\s-]?\d{4})/);
  if(phone) out.phone = phone[1].replace(/[\s-]/g,"");
  const post = txt.match(/(?:S(?:ingapore)?\s*\(?)?\b(\d{6})\b\)?/);
  const lines = txt.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  const addrLine = lines.find(l => /blk|block|#\d|street|st\.|road|rd\b|ave|avenue|lane|drive|dr\b|crescent|jalan|lorong|tampines|jurong|yishun|bedok|hougang|woodlands|clementi|serangoon|toa payoh|ang mo kio|bukit|geylang|kallang|punggol|sengkang|choa chu kang|pasir ris|marine parade|queenstown|bishan|novena|orchard/i.test(l));
  if(addrLine) out.address = addrLine;
  else if(post) out.address = (lines.find(l=>l.includes(post[1])) || "").trim();
  if(post && out.address && !out.address.includes(post[1])) out.address += " S" + post[1];
  const nameLine = lines.find(l => /^(tên|ten|name|chị|anh|c\.|a\.)\s*[:\-]?\s*(.+)/i.test(l));
  if(nameLine) out.name = nameLine.replace(/^(tên|ten|name)\s*[:\-]?\s*/i,"").trim();
  else if(lines[0] && lines[0].length<40 && !/\d{6}/.test(lines[0])) out.name = lines[0];
  return out;
}

const PREPCLS = {chua:"pchua", dang:"pdang", du:"pdu", thieu:"pthieu"};

function orderCard(o, mode){
  const kho = mode==="kho";
  const total = orderNet(o);
  const prep = o.prep || "chua";
  const items = (o.items||[]).map(i=> i.qty+"× "+i.name).join(" · ");
  const stripe = kho
    ? (prep==="du" ? "green" : prep==="thieu" ? "red" : prep==="dang" ? "amber" : "blue")
    : (o.pay==="chua" ? "red" : o.pay==="coc" ? "amber" : "green");
  const payPill = '<span class="pill p-'+o.pay+'">'+PAY[o.pay]+(o.pay==="coc" && o.deposit ? " "+money(o.deposit) : "")+'</span>';
  return '<article class="order'+(o.status==="xong"||o.status==="huy"?" done":"")+'" data-stripe="'+stripe+'" data-id="'+o.id+'">'
    + '<div class="l1"><span class="who">'+esc(o.customer||"Khách lẻ")+'</span>'
    + (o.agent ? '<span class="agent">'+esc(o.agent)+'</span>' : "")
    + (kho ? '<span class="amt mono">'+(o.items||[]).length+' món</span>' : '<span class="amt mono">'+money(total)+'</span>')+'</div>'
    + (kho ? "" : '<div class="l2"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>'+esc(o.address||"Chưa có địa chỉ")+'</span></div>')
    + (items ? '<div class="l2"'+(kho?"":' style="margin-left:20px"')+'>'+esc(items)+'</div>' : "")
    + '<div class="l3">'
    + (kho ? '<span class="pill p-'+PREPCLS[prep]+'">'+PREP[prep]+'</span>' + payPill
           : '<span class="pill p-'+o.status+'">'+STATUS[o.status]+'</span>' + payPill
             + (prep==="thieu" ? '<span class="pill p-pthieu">Thiếu hàng</span>' : prep==="du" ? '<span class="pill p-pdu">Đã soạn</span>' : ""))
    + (orderKg(o) ? '<span class="pill brand mono">'+kgTxt(orderKg(o))+'</span>' : "")
    + (o.discount || o.manualDiscount ? '<span class="pill p-pdu">− '+money(orderDisc(o))+'</span>' : "")
    + '<span class="pill brand">'+esc(o.brand)+'</span>'
    + '<span class="pill time mono">'+viDate(o.date)+(o.time?" "+o.time:"")+' · '+orderCode(o)+'</span>'
    + '</div></article>';
}

function viewOrders(){
  const chips = [
    ["active","Đang xử lý"],["today","Hôm nay"],["late","Quá hạn chưa thu"],["chua","Chưa thu tiền"],["all","Tất cả"]
  ];
  let list = DB.orders.slice().sort((a,b)=> (b.date+" "+(b.time||"")).localeCompare(a.date+" "+(a.time||"")));
  if(F.status==="active") list = list.filter(o=> o.status!=="xong" && o.status!=="huy");
  if(F.status==="today")  list = list.filter(o=> o.date===todayStr());
  if(F.status==="chua")   list = list.filter(o=> o.pay!=="da" && o.status!=="huy");
  if(F.status==="late")   list = list.filter(o=> o.status!=="huy" && o.pay!=="da" && o.date < todayStr());
  if(F.brand!=="all")     list = list.filter(o=> o.brand===F.brand);
  if(F.q){
    const q = F.q.toLowerCase();
    list = list.filter(o => (o.customer+" "+o.phone+" "+o.address+" "+(o.agent||"")).toLowerCase().includes(q));
  }
  if(F.agent && F.agent!=="all") list = list.filter(o=> o.agent === F.agent);

  const unpaid = DB.orders.filter(o=>o.pay!=="da" && o.status!=="huy").reduce((s,o)=>s+orderNet(o)-(o.deposit||0),0);
  const late = overdue();
  const lateSum = late.reduce((s,o)=> s + orderNet(o) - (o.deposit||0), 0);

  $("#v-orders").innerHTML =
    '<button class="btn" id="newOrder" style="margin-bottom:10px">+ Đơn mới</button>'
    + (ROLE!=="owner" ? '<button class="btn ghost sm" id="mySheet" style="width:100%;margin-bottom:12px">📒 Sổ bill của tôi'+(lastAgent()?" — "+esc(lastAgent()):"")+'</button>' : "")
    + (late.length ? '<div class="note" style="margin-bottom:10px;border-color:var(--danger);background:var(--danger-soft)">'
        + '<b>⏰ '+late.length+' bill quá hạn chưa thu — '+money(lateSum)+'</b><br>'
        + late.slice(0,4).map(o=> esc(o.customer||"Khách lẻ")+(o.agent?" ("+esc(o.agent)+")":"")+" · "+orderCode(o)+" · trễ "+daysLate(o)+" ngày · "+money(orderNet(o)-(o.deposit||0))).join("<br>")
        + (late.length>4 ? '<br>… và '+(late.length-4)+' bill nữa' : "")
        + '<br><button type="button" class="btn danger sm" id="showLate" style="margin-top:8px">Xem hết</button></div>' : "")
    + (unpaid>0 ? '<div class="note" style="margin-bottom:12px">Còn <b class="mono">'+money(unpaid)+'</b> chưa thu từ '+DB.orders.filter(o=>o.pay!=="da"&&o.status!=="huy").length+' đơn.</div>' : "")
    + '<div class="field" style="margin-bottom:8px"><input id="q" placeholder="Tìm tên khách, số điện thoại, địa chỉ…" value="'+esc(F.q)+'"></div>'
    + '<div class="filters">'+ chips.map(c=>'<button class="fchip'+(F.status===c[0]?" on":"")+'" data-f="'+c[0]+'">'+c[1]+'</button>').join("")
    + '<span style="width:1px;background:var(--line);flex:none;margin:2px 3px"></span>'
    + ['all'].concat(BRANDS).map(b=>'<button class="fchip'+(F.brand===b?" on":"")+'" data-b="'+esc(b)+'">'+(b==="all"?"Mọi brand":esc(b))+'</button>').join("")
    + (allAgents().length ? '<span style="width:1px;background:var(--line);flex:none;margin:2px 3px"></span>'
        + ['all'].concat(allAgents()).map(a=>'<button class="fchip'+(F.agent===a?" on":"")+'" data-ag="'+esc(a)+'">'+(a==="all"?"Mọi NV":"NV "+esc(a))+'</button>').join("") : "")
    + '</div>'
    + (list.length ? '<div class="rowlist">'+list.map(orderCard).join("")+'</div>'
        : '<div class="empty"><strong>Chưa có đơn nào</strong>Bấm “Đơn mới” hoặc dán tin nhắn khách vào để tạo đơn.</div>');

  $("#newOrder").onclick = ()=> orderForm(null);
  const sl = $("#showLate"); if(sl) sl.onclick = ()=>{ F.status = "late"; viewOrders(); };
  const ms = $("#mySheet");
  if(ms) ms.onclick = ()=>{
    const code = lastAgent();
    if(!code){ toast("Tạo một đơn có mã NV trước, app sẽ nhớ mã của bạn"); return; }
    agentSheet(code, todayStr().slice(0,7));
  };
  $("#v-orders").querySelectorAll("[data-f]").forEach(b=> b.onclick=()=>{ F.status=b.dataset.f; viewOrders(); });
  $("#v-orders").querySelectorAll("[data-b]").forEach(b=> b.onclick=()=>{ F.brand=b.dataset.b; viewOrders(); });
  $("#v-orders").querySelectorAll("[data-ag]").forEach(b=> b.onclick=()=>{ F.agent=b.dataset.ag; viewOrders(); });
  $("#v-orders").querySelectorAll(".order").forEach(c=> c.onclick=()=> orderDetail(c.dataset.id));
  const qi = $("#q");
  qi.oninput = ()=>{ F.q = qi.value; clearTimeout(qi._t); qi._t=setTimeout(()=>{ viewOrders(); $("#q").focus(); },250); };
}

        <div class="note" style="margin-top:6px;font-size:12px">Dán vô là app tự đọc — tên, mã NV, sđt, địa chỉ, món, số lượng, giá, ngày giao tự điền xuống dưới.</div>

      </div>

    </div>
    <select id="f_pay" class="hidden">${Object.keys(PAY).map(k=>'<option value="'+k+'"'+(d.pay===k?" selected":"")+'>'+PAY[k]+'</option>').join("")}</select>
    <div class="field" id="depwrap"><label>Cọc bao nhiêu</label>
      <div class="curwrap">
        <button type="button" class="cur${d.vnd?"":" on"}" data-cur="sgd">S$</button>
        <button type="button" class="cur${d.vnd?" on":""}" data-cur="vnd">₫ tiền Việt</button>
      </div>
      <input type="number" step="0.01" min="0" id="f_deposit" value="${d.vnd ? (d.depositVnd||"") : (d.deposit||"")}" placeholder="0.00">
      <input type="hidden" id="f_vnd" value="${d.vnd?"1":""}">

    {label:"Huỷ", cls:"ghost", fn:null},
    {label: o?"Lưu thay đổi":"Tạo đơn", cls:"", fn:()=>{
      const items = [];
      Object.keys(picked).forEach(sku=>{
        const n = picked[sku];
        if(!(n>0)) return;
        const it = DB.items.find(x=>x.sku===sku); if(!it) return;
        items.push({sku:it.sku, name:it.name, unit:it.unit, qty:n, price:it.price, cost:itemCost(it), kg:itemKg(it)});
      });
      extra.forEach(e=>{
        if(!(e.qty > 0) || !String(e.name).trim()) return;
        items.push({sku:e.sku, name:e.name.trim(), unit:e.unit||"phần", qty:e.qty,
          price:e.price||0, cost:0, kg:0, note:e.note||""});
      });
      const sub = items.reduce((s,i)=> s + i.qty*i.price, 0);
      const kg  = items.reduce((s,i)=> s + i.qty*(i.kg||0), 0);
      /* giảm giá: nhân viên tự gõ · % chỉ trên tiền hàng, phí giao thu đủ */
      const shipAmt = +items.reduce((t,i)=> t + (isShipName(i.name) ? i.qty*i.price : 0), 0).toFixed(2);
      const goodsAmt = Math.max(0, +(sub - shipAmt).toFixed(2));
      const dPct = Math.min(100, Math.max(0, parseFloat($("#f_dpct").value) || 0));
      const dPctAmt = +(goodsAmt * dPct / 100).toFixed(2);
      const dManual = Math.max(0, Math.min(parseFloat($("#f_mdisc").value) || 0, Math.max(0, sub - dPctAmt)));
      const rec = Object.assign({}, d, {
        brand: $("#f_brand").value,
        customer: $("#f_customer").value.trim(),
        agent: $("#f_agent").value.trim().toUpperCase(),
        phone: $("#f_phone").value.trim(),
        address: $("#f_address").value.trim(),
